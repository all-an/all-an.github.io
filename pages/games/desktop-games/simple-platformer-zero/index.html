<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Little Square Platformer</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; background: #2b2b3d; overflow: hidden; }
  body { display: flex; align-items: center; justify-content: center; }
  /* 800x600 backing store, scaled by whole-number steps only, never stretched */
  canvas { image-rendering: pixelated; background: #2b2b3d; outline: none; }
</style>
</head>
<body>
<canvas id="game" width="800" height="600" tabindex="0"></canvas>
<!-- The soundtrack and effects, generated sample by sample (no audio files).
     Runs inside an AudioWorklet so none of the maths touches the game thread;
     the game only posts {play, rise} and {muted} messages. A port of Game.Audio. -->
<script type="text/plain" id="synth-src">
const SR = sampleRate;                 // the context's rate (Java ran at 44100)
const RATE_SCALE = SR / 44100;         // keeps reverb delay times the same in seconds
const MASTER = 0.18, WET = 0.55, DRY = 0.45, NOISE_GAIN = 0.04;
const COMB_FB = 0.87, COMB_DAMP = 0.25, ALLPASS_FB = 0.5, REVERB_IN = 0.06;
const COMB_LENS = [1116, 1188, 1277, 1356];
const ALLPASS_LENS = [556, 441];
const STEREO_SPREAD = 23;              // the right channel taps later, which widens the tail

// Per-effect levels. The jump fires on every hop, so it sits well under the one-offs.
const JUMP_GAIN = 0.012, COIN_GAIN = 0.05, WARP_GAIN = 0.05, PUNCH_GAIN = 0.09;
const SHOT_GAIN = 0.03, TYPE_GAIN = 0.06, PORTAL_GAIN = 0.08;

const NONE = 0, JUMP = 1, COIN = 2, TYPE = 3, WARP = 4, PUNCH = 5, SHOT = 6, PORTAL = 7;

// A minor / Phrygian flavour: frequency, triangle?, volume.
const DRONE_SPECS = [
  [55.00, false, 0.30], [82.41, false, 0.18], [110.00, true, 0.14], [130.81, false, 0.10], [164.81, true, 0.07]];
const GHOST_SCALE = [220, 246.94, 261.63, 293.66, 329.63, 349.23, 392.00, 440.00];

const clampF = (v, lo, hi) => Math.max(lo, Math.min(hi, v));

// ---- A textbook RBJ biquad ----
class Biquad {
  constructor() { this.b0 = 0; this.b1 = 0; this.b2 = 0; this.a1 = 0; this.a2 = 0; this.x1 = 0; this.x2 = 0; this.y1 = 0; this.y2 = 0; }
  lowpass(freq, q) {
    const w = 2 * Math.PI * freq / SR, c = Math.cos(w), alpha = Math.sin(w) / (2 * q), a0 = 1 + alpha;
    this.b0 = (1 - c) / 2 / a0; this.b1 = (1 - c) / a0; this.b2 = this.b0;
    this.a1 = -2 * c / a0; this.a2 = (1 - alpha) / a0;
  }
  // Constant peak gain, which is what Web Audio's "bandpass" is.
  bandpass(freq, q) {
    const w = 2 * Math.PI * freq / SR, c = Math.cos(w), alpha = Math.sin(w) / (2 * q), a0 = 1 + alpha;
    this.b0 = alpha / a0; this.b1 = 0; this.b2 = -alpha / a0;
    this.a1 = -2 * c / a0; this.a2 = (1 - alpha) / a0;
  }
  process(x) {
    const y = this.b0 * x + this.b1 * this.x1 + this.b2 * this.x2 - this.a1 * this.y1 - this.a2 * this.y2;
    this.x2 = this.x1; this.x1 = x; this.y2 = this.y1; this.y1 = y;
    return y;
  }
}

// ---- Schroeder reverb: 4 combs + 2 allpasses per channel ----
class Comb {
  constructor(size) { this.buf = new Float32Array(size); this.size = size; this.idx = 0; this.store = 0; }
  process(x) {
    const out = this.buf[this.idx];
    this.store = out * (1 - COMB_DAMP) + this.store * COMB_DAMP;
    this.buf[this.idx] = x + this.store * COMB_FB;
    this.idx = (this.idx + 1) % this.size;
    return out;
  }
}
class Allpass {
  constructor(size) { this.buf = new Float32Array(size); this.size = size; this.idx = 0; }
  process(x) {
    const buffered = this.buf[this.idx];
    const out = -x + buffered;
    this.buf[this.idx] = x + buffered * ALLPASS_FB;
    this.idx = (this.idx + 1) % this.size;
    return out;
  }
}

const oscSine = (phase) => Math.sin(2 * Math.PI * phase);
const oscSquare = (phase) => (phase - Math.floor(phase)) < 0.5 ? 1 : -1;
const oscTriangle = (phase) => { const p = phase - Math.floor(phase); return p < 0.5 ? 4 * p - 1 : 3 - 4 * p; };

// Web Audio's exponentialRampToValueAtTime, which the effects were written
// against: it moves geometrically, never touching zero.
function expRamp(v0, v1, t, d) {
  if (t <= 0) return v0;
  if (t >= d) return v1;
  return v0 * Math.pow(v1 / v0, t / d);
}

class Synth extends AudioWorkletProcessor {
  constructor() {
    super();
    this.muted = false;
    this.rng = 0x9e3779b9 | 0;         // xorshift: its own noise stream, independent of the game
    this.drones = DRONE_SPECS.map((spec, i) => {
      const cents = (this.arand01() - 0.5) * 10;       // slight detuning
      return { phase: 0, freq: spec[0] * Math.pow(2, cents / 1200), vol: spec[2], lfoPhase: 0, lfoHz: 0.08 + i * 0.03, triangle: spec[1] };
    });
    this.ghosts = Array.from({ length: 8 }, () => ({ active: false, t: 0, dur: 0, attack: 0, freq: 0, peak: 0, phase: 0, vibPhase: 0, vibHz: 0 }));
    this.ghostTimer = [0.8, 2.5, 4.2];                 // three staggered chains
    this.lp = new Biquad(); this.lp.lowpass(900, 1.2); // the bus filter
    this.noiseFilt = new Biquad(); this.noiseFilt.bandpass(80, 0.5);   // the rumble
    this.noiseLfo = 0;
    const scaled = (n) => Math.round(n * RATE_SCALE);
    this.combsL = COMB_LENS.map((n) => new Comb(scaled(n)));
    this.combsR = COMB_LENS.map((n) => new Comb(scaled(n + STEREO_SPREAD)));
    this.apsL = ALLPASS_LENS.map((n) => new Allpass(scaled(n)));
    this.apsR = ALLPASS_LENS.map((n) => new Allpass(scaled(n + STEREO_SPREAD)));
    this.sfx = Array.from({ length: 8 }, () => ({ kind: NONE, t: 0, phase: 0, phase2: 0, rise: false, filt: new Biquad() }));
    this.port.onmessage = (e) => {
      if (e.data.muted !== undefined) this.muted = e.data.muted;
      if (e.data.play !== undefined) this.playSfx(e.data.play, e.data.rise);
    };
  }

  arand() {
    let r = this.rng;
    r ^= r << 13; r ^= r >>> 17; r ^= r << 5;
    this.rng = r;
    return (r >>> 0) / 4294967295 * 2 - 1;             // -1..1
  }
  arand01() { return (this.arand() + 1) * 0.5; }

  spawnGhost() {
    for (const gh of this.ghosts) {
      if (gh.active) continue;
      const dur = 4 + this.arand01() * 5;
      gh.active = true; gh.t = 0; gh.dur = dur; gh.attack = dur * 0.35;
      gh.freq = GHOST_SCALE[Math.floor(this.arand01() * 8) % 8];
      gh.peak = 0.06 + this.arand01() * 0.05;
      gh.phase = 0; gh.vibPhase = 0; gh.vibHz = 0.5 + this.arand01() * 0.5;
      return;
    }
  }

  // Steal the oldest voice if all eight are busy.
  playSfx(kind, rise) {
    let slot = -1, oldest = -1;
    for (let i = 0; i < this.sfx.length; i++) {
      const s = this.sfx[i];
      if (s.kind === NONE) { slot = i; break; }
      if (s.t > oldest) { oldest = s.t; slot = i; }
    }
    if (slot < 0) return;
    const s = { kind, t: 0, phase: 0, phase2: 0, rise: !!rise, filt: new Biquad() };
    if (kind === TYPE) s.filt.bandpass(2600, 1.2);
    else if (kind === WARP) s.filt.bandpass(1200, 1.0);      // the airy part of the whoosh
    else if (kind === PUNCH) s.filt.bandpass(500, 0.8);      // dull and low, not a click
    else if (kind === SHOT) s.filt.bandpass(2200, 1.4);      // the thin edge on the attack
    else if (kind === PORTAL) s.filt.bandpass(1500, 0.6);    // a wide airy band for the vortex
    this.sfx[slot] = s;
  }

  // The seven effects, ported envelope for envelope.
  renderSfx(dt) {
    let total = 0;
    for (const s of this.sfx) {
      switch (s.kind) {
        case JUMP: {                   // square wave sweeping up: the recognisable retro hop
          const DUR = 0.16;
          const freq = s.t < DUR * 0.7 ? expRamp(320, 760, s.t, DUR * 0.7) : expRamp(760, 660, s.t - DUR * 0.7, DUR * 0.3);
          let env;
          if (s.t < 0.01) env = expRamp(0.0001, JUMP_GAIN, s.t, 0.01);
          else if (s.t < DUR * 0.6) env = JUMP_GAIN;
          else env = expRamp(JUMP_GAIN, 0.0001, s.t - DUR * 0.6, DUR * 0.4);
          total += oscSquare(s.phase) * env;
          s.phase += freq * dt; s.t += dt;
          if (s.t >= DUR) s.kind = NONE;
          break;
        }
        case COIN: {                   // two flat square notes a fourth apart, the second ringing out
          const BLIP = 0.075, RING = 0.42;
          const freq = s.t < BLIP ? 987.77 : 1318.51;      // B5 -> E6, hard step
          let env;
          if (s.t < 0.005) env = expRamp(0.0001, 1, s.t, 0.005);
          else if (s.t < BLIP + 0.06) env = 1;
          else env = expRamp(1, 0.0001, s.t - (BLIP + 0.06), RING - 0.06);
          total += oscSquare(s.phase) * env * COIN_GAIN;
          s.phase += freq * dt; s.t += dt;
          if (s.t >= BLIP + RING) s.kind = NONE;
          break;
        }
        case WARP: {                   // a swept tone with a shimmering fifth over an airy whoosh
          const DUR = 0.45, lo = 200, hi = 1500;
          const freq = expRamp(s.rise ? lo : hi, s.rise ? hi : lo, s.t, DUR * 0.8);
          const env = s.t < 0.008 ? expRamp(0.0001, 1, s.t, 0.008) : expRamp(1, 0.0001, s.t - 0.008, DUR - 0.008);
          const tone = oscSine(s.phase) * 0.6 + oscSine(s.phase2) * 0.22;
          const whoosh = s.filt.process(this.arand()) * expRamp(1, 0.0001, s.t, DUR * 0.6);
          total += (tone + whoosh * 0.5) * env * WARP_GAIN;
          s.phase += freq * dt;
          s.phase2 += freq * 1.5 * dt;                     // a fifth above, for the shimmer
          if (s.phase2 >= 1) s.phase2 -= Math.floor(s.phase2);
          s.t += dt;
          if (s.t >= DUR) s.kind = NONE;
          break;
        }
        case PUNCH: {                  // a blunt thump: a pitch that drops away under a dull noise slap
          const DUR = 0.18;
          const freq = expRamp(190, 55, s.t, 0.09);
          const env = s.t < 0.004 ? expRamp(0.0001, 1, s.t, 0.004) : expRamp(1, 0.0001, s.t - 0.004, DUR - 0.004);
          const body = oscSine(s.phase) * 0.9;
          const slap = s.filt.process(this.arand()) * expRamp(1, 0.0001, s.t, 0.05);
          total += (body + slap * 0.7) * env * PUNCH_GAIN;
          s.phase += freq * dt; s.t += dt;
          if (s.t >= DUR) s.kind = NONE;
          break;
        }
        case SHOT: {                   // a short bright "pew": a square tone falling fast, a thin noise edge
          const DUR = 0.11;
          const freq = expRamp(1500, 380, s.t, DUR * 0.75);
          const env = s.t < 0.003 ? expRamp(0.0001, 1, s.t, 0.003) : expRamp(1, 0.0001, s.t - 0.003, DUR - 0.003);
          const edge = s.filt.process(this.arand()) * expRamp(1, 0.0001, s.t, 0.025);
          total += (oscSquare(s.phase) * 0.8 + edge * 0.6) * env * SHOT_GAIN;
          s.phase += freq * dt; s.t += dt;
          if (s.t >= DUR) s.kind = NONE;
          break;
        }
        case PORTAL: {                 // a tone spiralling down and away under an airy noise vortex
          const DUR = 0.95;
          const frac = clampF(s.t / DUR, 0, 1);
          const base = expRamp(880, 70, s.t, DUR * 0.92);
          const wob = Math.sin(2 * Math.PI * (6 + 30 * frac) * s.t) * (30 + 150 * frac);
          const freq = base + wob;
          const env = s.t < DUR * 0.18 ? expRamp(0.0001, 1, s.t, DUR * 0.18) : expRamp(1, 0.0001, s.t - DUR * 0.18, DUR * 0.82);
          const tone = oscSine(s.phase) * 0.55 + oscTriangle(s.phase2) * 0.25;
          const vortex = s.filt.process(this.arand()) * Math.sin(Math.PI * frac);
          total += (tone + vortex * 0.8) * env * PORTAL_GAIN;
          s.phase += freq * dt;
          s.phase2 += freq * 2.02 * dt;                    // a detuned octave shimmer
          if (s.phase2 >= 1) s.phase2 -= Math.floor(s.phase2);
          s.t += dt;
          if (s.t >= DUR) s.kind = NONE;
          break;
        }
        case TYPE: {                   // a filtered noise transient (the plastic click) over a low thock
          const CLICK = 0.05, DUR = 0.08;
          let click = 0;
          if (s.t < CLICK) {
            const decay = 1 - s.t / CLICK;
            const env = s.t < 0.002 ? expRamp(0.0001, 1, s.t, 0.002) : expRamp(1, 0.0001, s.t - 0.002, CLICK - 0.002);
            click = s.filt.process(this.arand() * decay) * env;
          }
          const thockFreq = expRamp(220, 110, s.t, 0.04);
          const thockEnv = s.t < 0.003 ? expRamp(0.0001, 0.6, s.t, 0.003) : expRamp(0.6, 0.0001, s.t - 0.003, 0.057);
          total += (click + oscTriangle(s.phase) * thockEnv) * TYPE_GAIN;
          s.phase += thockFreq * dt; s.t += dt;
          if (s.t >= DUR) s.kind = NONE;
          break;
        }
      }
      if (s.phase >= 1) s.phase -= Math.floor(s.phase);
    }
    return total;
  }

  // One pass per sample: drones and ghosts through the bus filter, split
  // dry/wet, the wet half through the reverb, rumble and effects added flat.
  process(inputs, outputs) {
    const left = outputs[0][0], right = outputs[0][1] || outputs[0][0];
    const n = left.length;
    if (this.muted) {                  // frozen, like suspending the graph: no state advances
      left.fill(0); right.fill(0);
      return true;
    }
    const dt = 1 / SR;
    for (let i = 0; i < this.ghostTimer.length; i++) {    // ghost chains are scheduled per block
      this.ghostTimer[i] -= n / SR;
      if (this.ghostTimer[i] <= 0) {
        this.spawnGhost();
        this.ghostTimer[i] = 3 + this.arand01() * 6;
      }
    }
    for (let i = 0; i < n; i++) {
      let bus = 0;
      for (const d of this.drones) {
        const wave = d.triangle ? oscTriangle(d.phase) : oscSine(d.phase);
        bus += wave * (d.vol + oscSine(d.lfoPhase) * d.vol * 0.25);
        d.phase += d.freq * dt; if (d.phase >= 1) d.phase -= 1;
        d.lfoPhase += d.lfoHz * dt; if (d.lfoPhase >= 1) d.lfoPhase -= 1;
      }
      for (const gh of this.ghosts) {
        if (!gh.active) continue;
        const env = gh.t < gh.attack ? gh.peak * gh.t / gh.attack : gh.peak * (1 - (gh.t - gh.attack) / (gh.dur - gh.attack));
        bus += oscSine(gh.phase) * Math.max(env, 0);
        const vib = oscSine(gh.vibPhase) * 1.5;           // vibrato
        gh.phase += (gh.freq + vib) * dt; if (gh.phase >= 1) gh.phase -= 1;
        gh.vibPhase += gh.vibHz * dt; if (gh.vibPhase >= 1) gh.vibPhase -= 1;
        gh.t += dt;
        if (gh.t >= gh.dur) gh.active = false;
      }
      const filtered = this.lp.process(bus);
      const wetIn = filtered * WET * REVERB_IN;
      let wetL = 0, wetR = 0;
      for (let j = 0; j < 4; j++) { wetL += this.combsL[j].process(wetIn); wetR += this.combsR[j].process(wetIn); }
      wetL *= 0.25; wetR *= 0.25;
      for (let j = 0; j < 2; j++) { wetL = this.apsL[j].process(wetL); wetR = this.apsR[j].process(wetR); }
      const dry = filtered * DRY;
      let rumble = this.noiseFilt.process(this.arand());   // slow breathing rumble under everything
      rumble *= NOISE_GAIN + oscSine(this.noiseLfo) * 0.02;
      this.noiseLfo += 0.05 * dt; if (this.noiseLfo >= 1) this.noiseLfo -= 1;
      const sfxOut = this.renderSfx(dt);
      left[i] = clampF((dry + wetL + rumble) * MASTER + sfxOut, -1, 1);
      right[i] = clampF((dry + wetR + rumble) * MASTER + sfxOut, -1, 1);
    }
    return true;
  }
}
registerProcessor('synth', Synth);
</script>
<script>
"use strict";

// ---- World (matches Game.java) ----
const CELL = 20;                       // px, one level cell
const COLS = 40;
const ROWS = 30;
const FINE = 5;                        // px, the quarter-cell overlay grid
const WORLD_W = COLS * CELL;           // 800
const WORLD_H = ROWS * CELL;           // 600
const BG_COLOR = '#2b2b3d';            // the old #game background
// Java's physics constants are per *frame* at 60fps, so the loop steps at a
// fixed 1/60 s and never scales motion by a variable dt.
const STEP = 1 / 60;                   // seconds per update
const MAX_CATCH_UP = 0.1;              // seconds of backlog kept after a stall (tab switch, etc.)

const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');

// Which screen is up: the level picker, or one of the levels.
const SCREEN_SELECT = 0, SCREEN_LEVEL1 = 1, SCREEN_LEVEL2 = 2, SCREEN_LEVEL3 = 3, SCREEN_LEVEL4 = 4;
let screen = SCREEN_SELECT;
let currentLevel = 1;

// ---- Offscreen layers ----
// "Bake once, move forever": anything that never changes is drawn to an
// offscreen canvas a single time and only blitted afterwards.
function makeLayer(width, height) {
  const layer = document.createElement('canvas');
  layer.width = width;
  layer.height = height;
  return layer;
}

// The background and base 20px grid, baked once. Same three passes, in the
// same order, as Game.drawGrid: a faint panel fill, then the lines at two
// alphas stacked on the same positions (Java drew an outer and an inner set).
const gridLayer = makeLayer(WORLD_W, WORLD_H);
(function bakeGrid() {
  const g = gridLayer.getContext('2d');
  g.fillStyle = BG_COLOR;
  g.fillRect(0, 0, WORLD_W, WORLD_H);

  g.fillStyle = 'rgba(255,255,255,' + 8 / 255 + ')';        // play-area panel
  g.fillRect(0, 0, WORLD_W, WORLD_H);

  g.fillStyle = 'rgba(255,255,255,' + 10 / 255 + ')';       // outer lines
  for (let x = 0; x < WORLD_W; x += CELL) g.fillRect(x, 0, 1, WORLD_H);
  for (let y = 0; y < WORLD_H; y += CELL) g.fillRect(0, y, WORLD_W, 1);

  g.fillStyle = 'rgba(255,255,255,' + 20 / 255 + ')';       // inner lines
  for (let c = 0; c <= COLS; c++) g.fillRect(c * CELL, 0, 1, WORLD_H);
  for (let r = 0; r <= ROWS; r++) g.fillRect(0, r * CELL, WORLD_W, 1);
})();


// ---- Drawing primitives & baking toolkit (step 1) ----
// Colours are CSS strings resolved once; nothing below builds a colour, a
// gradient or a path inside the per-frame code.

// "#rrggbb" string from a 0xRRGGBB int, optionally with a 0..255 alpha.
function hex(rgb, alpha) {
  const r = (rgb >> 16) & 255, g = (rgb >> 8) & 255, b = rgb & 255;
  return alpha === undefined ? 'rgb(' + r + ',' + g + ',' + b + ')'
                             : 'rgba(' + r + ',' + g + ',' + b + ',' + alpha / 255 + ')';
}

const FONT_FAMILY = '-apple-system, "Helvetica Neue", Arial, sans-serif';

function clamp(v, lo, hi) { return Math.max(lo, Math.min(hi, v)); }

// The 1.4 s ease-in-out pulse every glowing thing shares: 0 at the ends of
// the cycle, 1 in the middle.
function pulse() { return 0.5 - 0.5 * Math.cos(2 * Math.PI * time / 1.4); }

// Block kinds and the vertical gradient / border / top-highlight each is drawn in.
const BLUE = 0, GREEN = 1, ORANGE = 2, CYAN = 3, YELLOW = 4, MAGIC = 5, MOVING = 6, RED = 7, BLACK = 8;
const BLOCK_STYLES = [
  { name: 'BLUE',   top: 0x4d8bff, bot: 0x2255cc, border: 0x1a3f9e, inset: 89 },
  { name: 'GREEN',  top: 0x4dff6a, bot: 0x22cc44, border: 0x1a9e33, inset: 102 },
  { name: 'ORANGE', top: 0xffa64d, bot: 0xe06d00, border: 0x9e4a1a, inset: 89 },
  { name: 'CYAN',   top: 0x5ce8ff, bot: 0x00a8cc, border: 0x1a7a9e, inset: 89 },
  { name: 'YELLOW', top: 0xffe14d, bot: 0xe6b800, border: 0xb38f00, inset: 102 },
  { name: 'MAGIC',  top: 0xc98bff, bot: 0x7a2fd6, border: 0x4e1a8c, inset: 89 },
  { name: 'MOVING', top: 0x4dff6a, bot: 0x22cc44, border: 0x1a3f9e, inset: 102 },
  { name: 'RED',    top: 0xff6b6b, bot: 0xd61f1f, border: 0x8c1414, inset: 102 },
  { name: 'BLACK',  top: 0x3a3a3a, bot: 0x0d0d0d, border: 0x000000, inset: 89 },
];

// One CELL-sized sprite per kind, rendered once. Java blitted the same cached
// image, so its 1px border is clipped to the top and left edges (the right and
// bottom border pixels fell outside the 20x20 image) — reproduced here.
const blockSprites = BLOCK_STYLES.map((style) => {
  const sprite = makeLayer(CELL, CELL);
  const g = sprite.getContext('2d');
  const gradient = g.createLinearGradient(0, 0, 0, CELL);
  gradient.addColorStop(0, hex(style.top));
  gradient.addColorStop(1, hex(style.bot));
  g.fillStyle = gradient;
  g.fillRect(0, 0, CELL, CELL);
  g.fillStyle = hex(0xffffff, style.inset);           // highlight along the top edge
  g.fillRect(1, 1, CELL - 2, 2);
  g.fillStyle = hex(style.border);                    // top and left border pixels
  g.fillRect(0, 0, CELL, 1);
  g.fillRect(0, 0, 1, CELL);
  return sprite;
});

// A block at whole-pixel position (x, y). `alpha` and `scale` are only used by
// the 311 magic platform's fade/pop, where the sprite is scaled about its centre.
function drawBlock(kind, x, y, alpha = 1, scale = 1) {
  if (alpha <= 0.01) return;
  if (alpha === 1 && scale === 1) {
    ctx.drawImage(blockSprites[kind], Math.round(x), Math.round(y));
    return;
  }
  const size = CELL * scale;
  ctx.globalAlpha = alpha;
  ctx.drawImage(blockSprites[kind], Math.round(x + (CELL - size) / 2), Math.round(y + (CELL - size) / 2), size, size);
  ctx.globalAlpha = 1;
}

// A shiny three-tone square of edge `size`: dark edge, lit face, corner glint.
// Every piece colour is baked into a sprite once.
function makePieceSprite(size, edge, face, hi) {
  const sprite = makeLayer(size, size);
  const g = sprite.getContext('2d');
  g.fillStyle = hex(edge); g.fillRect(0, 0, size, size);
  g.fillStyle = hex(face); g.fillRect(0, 0, size - 2, size - 2);
  g.fillStyle = hex(hi);   g.fillRect(0, 0, 2, 2);
  return sprite;
}
const PIECE_WHITE = { edge: 0x8f9ad4, face: 0xf2f5ff, hi: 0xffffff };   // the player and its shots
const PIECE_RED = { edge: 0x9e1a1a, face: 0xff4d4d, hi: 0xffd6d6 };     // the enemies
const pieceWhite = makePieceSprite(FINE, PIECE_WHITE.edge, PIECE_WHITE.face, PIECE_WHITE.hi);
const pieceRed = makePieceSprite(FINE, PIECE_RED.edge, PIECE_RED.face, PIECE_RED.hi);

function drawPiece(sprite, x, y) {
  ctx.drawImage(sprite, Math.round(x), Math.round(y));
}

// ---- Glow: the Eyesz "shadow" rule ----
// Java's drawGlow stacked translucent rounded rects every frame, with the
// radius and alpha following pulse(). Here each glow is baked once into a
// short ladder of frames across the pulse (GLOW_STEPS + 1 of them) and, per
// frame, it is a single drawImage of the nearest one — the expensive picture
// is painted once, only its position and frame index change.
const GLOW_STEPS = 12;

// `layers` are {rgb:[r,g,b], spread, spreadRange, alpha, alphaRange}: at pulse
// p the layer's spread is spread + spreadRange*p and its strength alpha +
// alphaRange*p (the `6 + 4 * p` / `0.35 + 0.25 * p` of the Java call sites).
function makeGlowStyle(layers) {
  let widest = 0;
  for (const l of layers) widest = Math.max(widest, l.spread + l.spreadRange);
  return { layers, pad: Math.ceil(widest) + 2, cache: new Map() };
}

// Renders one pulse frame: the same ring loop as Game.drawGlow, onto a
// transparent canvas, so blitting it composites exactly as drawing live did.
function bakeGlowFrame(style, w, h, radius, p) {
  const pad = style.pad;
  const frame = makeLayer(w + 2 * pad, h + 2 * pad);
  const g = frame.getContext('2d');
  for (const l of style.layers) {
    const spread = l.spread + l.spreadRange * p;
    const strength = l.alpha + l.alphaRange * p;
    const rings = Math.floor(spread);
    for (let f = 1; f <= rings; f++) {
      const k = 1 - f / (spread + 1);
      const alpha = Math.round(clamp(strength * k * k, 0, 1) * 255) / 255;   // Java's fade() rounds to 8 bits
      const ringW = w + 2 * f, ringH = h + 2 * f;
      const arc = clamp((radius + f) * 2, 0, Math.min(ringW, ringH));
      g.fillStyle = 'rgba(' + l.rgb[0] + ',' + l.rgb[1] + ',' + l.rgb[2] + ',' + alpha + ')';
      g.beginPath();
      g.roundRect(pad - f, pad - f, ringW, ringH, arc / 2);
      g.fill();
    }
  }
  return frame;
}

// Frames for one size of one glow, baked on first use (the player's glow
// follows whatever parts are left, so its sizes aren't known up front).
function glowFrames(style, w, h, radius) {
  const key = (w * 1024 + h) * 16 + radius;
  let frames = style.cache.get(key);
  if (!frames) {
    frames = [];
    for (let i = 0; i <= GLOW_STEPS; i++) frames.push(bakeGlowFrame(style, w, h, radius, i / GLOW_STEPS));
    style.cache.set(key, frames);
  }
  return frames;
}

// Draws the glow around the box (x, y, w, h) at pulse position p (0..1).
function drawGlow(style, x, y, w, h, radius, p) {
  const frame = glowFrames(style, w, h, radius)[Math.round(p * GLOW_STEPS)];
  ctx.drawImage(frame, Math.round(x) - style.pad, Math.round(y) - style.pad);
}

const GLOW_WHITE = [255, 255, 255];
const GLOW_BLUE = [160, 190, 255];
const GLOW_SHOT_BLUE = [180, 205, 255];
const GLOW_BUTTON_OUTER = [255, 225, 120];
const GLOW_BUTTON_INNER = [255, 190, 40];
const GLOW_RED_OUTER = [255, 130, 130];
const GLOW_RED_INNER = [255, 40, 40];

// The glow styles the game uses (spread/alpha numbers straight from Game.java).
const glowPlayer = makeGlowStyle([     // white square, border line
  { rgb: GLOW_WHITE, spread: 6, spreadRange: 4, alpha: 0.35, alphaRange: 0.25 },
  { rgb: GLOW_BLUE, spread: 14, spreadRange: 8, alpha: 0.18, alphaRange: 0.14 }]);
const glowShot = makeGlowStyle([
  { rgb: GLOW_WHITE, spread: 7, spreadRange: 5, alpha: 0.50, alphaRange: 0.30 },
  { rgb: GLOW_SHOT_BLUE, spread: 16, spreadRange: 9, alpha: 0.22, alphaRange: 0.16 }]);
const glowPortal = makeGlowStyle([
  { rgb: GLOW_WHITE, spread: 6, spreadRange: 4, alpha: 0.30, alphaRange: 0.20 },
  { rgb: GLOW_BLUE, spread: 14, spreadRange: 8, alpha: 0.16, alphaRange: 0.12 }]);
const glowButton = makeGlowStyle([
  { rgb: GLOW_BUTTON_OUTER, spread: 6, spreadRange: 4, alpha: 0.40, alphaRange: 0.30 },
  { rgb: GLOW_BUTTON_INNER, spread: 14, spreadRange: 8, alpha: 0.20, alphaRange: 0.15 }]);
const glowEnemy = makeGlowStyle([      // hopping and standing enemy
  { rgb: GLOW_RED_OUTER, spread: 6, spreadRange: 4, alpha: 0.40, alphaRange: 0.30 },
  { rgb: GLOW_RED_INNER, spread: 14, spreadRange: 8, alpha: 0.20, alphaRange: 0.15 }]);

// ---- Audio (step 8) ----
// The synth lives in the AudioWorklet defined in #synth-src; this is just the
// handle the game uses. Browsers only allow sound after a user gesture, so the
// first key press or click unlocks it; until then effects are silently dropped.
const SFX_JUMP = 1, SFX_COIN = 2, SFX_TYPE = 3, SFX_WARP = 4, SFX_PUNCH = 5, SFX_SHOT = 6, SFX_PORTAL = 7;
const audio = {
  node: null,
  started: false,
  unlock() {
    if (this.started) return;
    this.started = true;
    try {
      const context = new AudioContext({ latencyHint: 'interactive' });
      const source = document.getElementById('synth-src').textContent;
      const blobUrl = URL.createObjectURL(new Blob([source], { type: 'text/javascript' }));
      // A blob: URL is refused when the page is opened from file://; a data: URL isn't.
      const dataUrl = 'data:text/javascript;charset=utf-8,' + encodeURIComponent(source);
      context.audioWorklet.addModule(blobUrl)
        .catch(() => context.audioWorklet.addModule(dataUrl))
        .then(() => {
          this.node = new AudioWorkletNode(context, 'synth', { outputChannelCount: [2] });
          this.node.connect(context.destination);
          this.node.port.postMessage({ muted });
        })
        .catch(() => {});
      if (context.state === 'suspended') context.resume();
    } catch (e) {
      // no audio available: the game is silent, nothing else changes
    }
  },
  // Plays an effect; `rise` is the warp's direction (up when growing back).
  play(kind, rise) {
    if (this.node) this.node.port.postMessage({ play: kind, rise: !!rise });
  },
  setMuted(value) {
    if (this.node) this.node.port.postMessage({ muted: value });
  },
};

// ---- Level 1: static layout (step 2) ----
// Every solid is one CELL-sized block (the standing enemy's pieces are FINE
// sized). Cells are numbered from 1, row by row, the way the level was authored.
const FINE_COLS = WORLD_W / FINE;      // 160
const MAGIC_CELL = 469;                // row 11, column 28 — the secret purple platform
const HARRY_PLATFORM_FROM = 209;       // Harry's ledge, cells 209..219
const HARRY_PLATFORM_TO = 219;
const STANDING_ENEMY_CELL = 873;       // row 21, column 32
const ENEMY_SPAN = CELL / FINE;        // 4 pieces a side
// Poison water basin (cells 1167-1181): the bottom row is left open under it.
const WATER_X = 6 * CELL, WATER_W = 15 * CELL;
const WATER_Y = 29 * CELL, WATER_H = CELL;

// Which motion, if any, a block gets once it is shot (used from step 6).
const MOVER_NONE = 0, MOVER_UP_DOWN_1 = 1, MOVER_DOWN_UP_8 = 2, MOVER_SHIFT = 3;

// Top-left pixel of a 1-based cell number on the 20px grid / the 5px grid.
function cellX(cell) { return ((cell - 1) % COLS) * CELL; }
function cellY(cell) { return Math.floor((cell - 1) / COLS) * CELL; }
function fineX(cell) { return ((cell - 1) % FINE_COLS) * FINE; }
function fineY(cell) { return Math.floor((cell - 1) / FINE_COLS) * FINE; }

function blockMoverKind(cell) {
  if (cell === 644) return MOVER_UP_DOWN_1;
  if (cell === 305) return MOVER_DOWN_UP_8;
  return MOVER_NONE;
}

const blocks = [];                     // in the same order Java pushed them; collision walks it in order

function makeBlock(x, y, size, kind, mover) {
  return { x, y, size, kind, off: false, mover, moving: false, homeX: x, homeY: y, moveT: 0, targetX: 0, targetY: 0 };
}

function addBlock(cell, kind) {
  blocks.push(makeBlock(cellX(cell), cellY(cell), CELL, kind, blockMoverKind(cell)));
}

// Out of collision and not drawn until something turns it on (the 311 platform).
function addOffBlock(cell, kind) {
  const b = makeBlock(cellX(cell), cellY(cell), CELL, kind, MOVER_NONE);
  b.off = true;
  blocks.push(b);
}

// Is a whole-cell block already standing on this cell? A 5px enemy piece sits
// on a cell without filling it, so only CELL-sized blocks answer.
function blockAt(x, y) {
  for (const b of blocks) if (b.size === CELL && b.x === x && b.y === y) return true;
  return false;
}

function addIfFree(cell) {
  if (!blockAt(cellX(cell), cellY(cell))) blocks.push(makeBlock(cellX(cell), cellY(cell), CELL, BLUE, MOVER_NONE));
}

// Blue blocks all the way round the screen. Cells that already hold a block
// keep it, and the stretch of the bottom row under the water stays open.
function addBorder() {
  for (let c = 1; c <= COLS; c++) addIfFree(c);                          // top row
  for (let r = 0; r < ROWS; r++) addIfFree(r * COLS + COLS);             // right column
  const waterCol = WATER_X / CELL, waterCols = WATER_W / CELL;
  for (let c = (ROWS - 1) * COLS + 1; c <= ROWS * COLS; c++) {           // bottom row
    const col = (c - 1) % COLS;
    if (col >= waterCol && col < waterCol + waterCols) continue;
    addIfFree(c);
  }
}

// Cell 873 cut along the 5px grid into a 4x4 of solids. Rows go in
// bottom-first: load-bearing for the vertical collision pass (step 3).
function addStandingEnemy() {
  const x0 = cellX(STANDING_ENEMY_CELL), y0 = cellY(STANDING_ENEMY_CELL);
  for (let row = ENEMY_SPAN - 1; row >= 0; row--) {
    for (let col = 0; col < ENEMY_SPAN; col++) {
      blocks.push(makeBlock(x0 + col * FINE, y0 + row * FINE, FINE, RED, MOVER_NONE));
    }
  }
}

function buildBlocks() {
  blocks.length = 0;
  addBlock(1126, BLUE);                // the two pillars either side of the water
  addBlock(1166, BLUE);
  addBlock(1142, BLUE);
  addBlock(1182, BLUE);
  addBlock(904, GREEN);
  addBlock(452, BLUE);
  addBlock(754, ORANGE);
  addBlock(305, CYAN);
  for (let c = 397; c <= 399; c++) addBlock(c, BLUE);   // the ledge under the 359 coin
  addBlock(562, BLUE);                 // ...and the one under 522

  addBlock(365, BLUE);                 // three single blue steps
  addBlock(444, BLUE);
  addBlock(644, BLUE);

  for (let c = HARRY_PLATFORM_FROM; c <= HARRY_PLATFORM_TO; c++) addBlock(c, BLUE);  // Harry's ledge
  for (let c = 204; c <= 208; c++) addBlock(c, BLUE);   // ...carried on to 204, so walking left reaches the 203 portal

  for (let c = 1; c <= 1161; c += COLS) addBlock(c, BLUE);  // wall down the left edge
  for (let c = 762; c <= 769; c++) addBlock(c, BLUE);       // the shelf on row 19
  for (let c = 911; c <= 920; c++) addBlock(c, GREEN);      // the shelf on row 22
  addBlock(910, GREEN);                // one more green step, left of that shelf
  for (let c = 458; c <= 459; c++) addBlock(c, YELLOW);     // the lift, parked at the top

  addStandingEnemy();                  // sixteen red-grid solids filling cell 873
  addOffBlock(MAGIC_CELL, MAGIC);      // earned by crossing column 28
  addBorder();
}
buildBlocks();

// Blocks that never move or change are baked with the grid into one layer;
// the lift, the magic platform, the shootable movers and the red enemy pieces
// are the only ones drawn live.
const dynamicBlocks = blocks.filter((b) => b.kind === YELLOW || b.kind === MAGIC || b.mover !== MOVER_NONE);
const level1Layer = makeLayer(WORLD_W, WORLD_H);
function bakeLevel1() {
  const g = level1Layer.getContext('2d');
  g.drawImage(gridLayer, 0, 0);
  for (const b of blocks) {
    if (b.kind === RED || dynamicBlocks.includes(b)) continue;
    g.drawImage(blockSprites[b.kind], b.x, b.y);
  }
  bakeHud(g);
}

// The standing enemy's sixteen pieces as one 20x20 sprite (it never changes;
// only its glow pulses behind it).
const standingEnemySprite = makeLayer(CELL, CELL);
(function bakeStandingEnemy() {
  const g = standingEnemySprite.getContext('2d');
  for (let row = 0; row < ENEMY_SPAN; row++) {
    for (let col = 0; col < ENEMY_SPAN; col++) g.drawImage(pieceRed, col * FINE, row * FINE);
  }
})();

function drawStandingEnemy() {
  const x = cellX(STANDING_ENEMY_CELL), y = cellY(STANDING_ENEMY_CELL);
  drawGlow(glowEnemy, x, y, CELL, CELL, 3, pulse());
  ctx.drawImage(standingEnemySprite, x, y);
}

// ---- Measuring tools: the 5px red grid (1) and the hovered cell number (H) ----
const fineGridLayer = makeLayer(WORLD_W, WORLD_H);
(function bakeFineGrid() {
  const g = fineGridLayer.getContext('2d');
  g.fillStyle = 'rgba(255,120,120,' + 191 / 255 + ')';
  for (let c = 0; c <= FINE_COLS; c++) g.fillRect(c * FINE, 0, 1, WORLD_H);
  for (let r = 0; r <= WORLD_H / FINE; r++) g.fillRect(0, r * FINE, WORLD_W, 1);
})();

// 1-based number of the cell under the pointer (5px cells while the red grid
// is up), or 0 when the readout is off or the pointer is outside the level.
function hoveredCell() {
  if (screen === SCREEN_SELECT || !debug.hover || !document.hasFocus()) return 0;
  if (mouseX < 0 || mouseY < 0 || mouseX >= WORLD_W || mouseY >= WORLD_H) return 0;
  if (debug.fine) return Math.floor(mouseY / FINE) * FINE_COLS + Math.floor(mouseX / FINE) + 1;
  return Math.floor(mouseY / CELL) * COLS + Math.floor(mouseX / CELL) + 1;
}

// The square under the pointer picked out over the level.
function drawHoverHighlight() {
  if (!hoveredCell()) return;
  if (debug.fine) {
    const x = Math.floor(mouseX / FINE) * FINE, y = Math.floor(mouseY / FINE) * FINE;
    ctx.fillStyle = 'rgba(255,70,70,' + 140 / 255 + ')';
    ctx.fillRect(x, y, FINE, FINE);
    ctx.fillStyle = 'rgba(255,80,80,' + 90 / 255 + ')';
    ctx.fillRect(x - 1, y - 1, FINE + 2, 1);
    ctx.fillRect(x - 1, y + FINE, FINE + 2, 1);
    ctx.fillRect(x - 1, y, 1, FINE);
    ctx.fillRect(x + FINE, y, 1, FINE);
  } else {
    ctx.fillStyle = 'rgba(136,136,200,' + 89 / 255 + ')';
    ctx.fillRect(Math.floor(mouseX / CELL) * CELL, Math.floor(mouseY / CELL) * CELL, CELL, CELL);
  }
}

// Top-right cell number, white over a dark drop shadow.
function drawCellNumber() {
  const n = hoveredCell();
  if (!n) return;
  ctx.font = 'bold 28px -apple-system, "Helvetica Neue", Arial, sans-serif';
  ctx.textAlign = 'right';
  ctx.textBaseline = 'top';
  ctx.fillStyle = 'rgba(0,0,0,' + 150 / 255 + ')';
  ctx.fillText(String(n), WORLD_W - 16, 12);
  ctx.fillStyle = '#fff';
  ctx.fillText(String(n), WORLD_W - 17, 11);
}

// Until the level select arrives (step 9) the game opens straight onto level 1.
// Drawn back to front in the order Game.java draws it.
function drawLevel1() {
  ctx.drawImage(level1Layer, 0, 0);
  for (const b of dynamicBlocks) {
    if (b.kind === MAGIC) drawBlock(MAGIC, b.x, b.y, magicAnim, 0.4 + 0.6 * magicAnim);
    else if (!b.off) drawBlock(b.kind, b.x, b.y);
  }
  drawStandingEnemy();
  drawPlatform();
  drawWater();
  drawPortal();
  drawCoins();
  drawButtons();
  drawEnemy();
  drawBorderLine();
  drawShots();                         // under the player, so a shot seems to leave from behind them
  drawWhitesquare();
  drawHarry();                         // the pointer-selectable character on the 209..219 ledge
  drawHarryBullets();
  drawLifebar();
  drawCoinCounter();
  if (debug.fine) ctx.drawImage(fineGridLayer, 0, 0);
  drawHoverHighlight();
  drawBackButton();
  drawDeathModal();                    // covers the whole screen, so it goes on last
}

// ---- White square: the original player (step 3) ----
// Every constant is per *frame* at 60fps, straight from Game.java, which is
// why the loop steps at a fixed 1/60 s instead of scaling by dt.
const WHITESQUARE_CELL = 1083;
const NORMAL_SIZE = CELL;              // 20
const SMALL_SIZE = FINE;               // 5, one red-grid cell
const MOVE_SPEED = 3.2;                // px per frame
const GRAVITY = 0.6;                   // px per frame^2
const JUMP_VELOCITY = -12;             // px per frame

let px = 0, py = 0;                    // world position, top-left
let prevPx = 0, prevPy = 0;            // where we were before this frame's movement
let vy = 0;
let psize = NORMAL_SIZE;               // shrinks to SMALL_SIZE past the shiny line (step 4)
let onGround = false, onPlatform = false, onYellow = false;   // what they're standing on
let prevJump = false;                  // jump is edge-triggered, so a tap is one jump
let faceDir = 1;                       // 1 = right; the way the last movement key pointed
let keyLeft = false, keyRight = false, keyJump = false, keyShoot = false;   // the white square's own input

function resetWhitesquare() {
  px = cellX(WHITESQUARE_CELL);
  py = cellY(WHITESQUARE_CELL);
  prevPx = px;
  prevPy = py;
  vy = 0;
  psize = NORMAL_SIZE;
  onGround = false;
  onPlatform = false;
  onYellow = false;
  faceDir = 1;                         // the spawn looks right, into the level

  // Pieces die with the player, the ones on the ground too.
  for (const shot of shots) shot.state = SHOT_GONE;
  prevShoot = true;
  // A new life comes back whole: all sixteen parts.
  partGone.fill(false);
}

// The white square's input from the raw key state, zeroed while Harry is the
// selected character. The facing is remembered
// rather than read when firing: holding both keys cancels the movement and
// leaves the facing alone.
function readInput() {
  if (harry.selected) {                // Harry has the keys; the square holds still
    keyLeft = false;
    keyRight = false;
    keyJump = false;
    keyShoot = false;
    return;
  }
  keyLeft = raw.left;
  keyRight = raw.right;
  keyJump = raw.jump;
  keyShoot = raw.shoot;
  if (keyLeft !== keyRight) faceDir = keyRight ? 1 : -1;
}

// Does the player box overlap the box at (bx, by, bw, bh)?
function overlapsRect(bx, by, bw, bh) {
  return px < bx + bw && px + psize > bx && py < by + bh && py + psize > by;
}

// Which face of a box at (by, bh) the player has to be put back onto: true for
// its top, false for its underside. Decided by where they were before this
// frame's fall — the shallower-overlap test alone isn't enough once a fall
// clears a whole cell.
function resolveToTop(by, bh) {
  if (prevPy + psize <= by) return true;       // feet were above it: a landing
  if (prevPy >= by + bh) return false;         // head was below it: a bonk
  return (py + psize) - by <= (by + bh) - py;
}

// Everything the player's body does in a frame: driven, carried by what it
// stands on, stopped by what it runs into, and drained by what it swims in.
function updateWhitesquare() {
  // ---- Horizontal movement + collision ----
  const startX = px;
  if (onPlatform) px += platDx;        // carried sideways
  if (keyLeft) px -= MOVE_SPEED;
  if (keyRight) px += MOVE_SPEED;
  const movingRight = px > startX;

  for (const b of blocks) {
    if (b.off || !overlapsRect(b.x, b.y, b.size, b.size)) continue;
    // Push sideways only when moving sideways caused the overlap — an overlap
    // the player was already inside horizontally belongs to the vertical pass.
    if (startX < b.x + b.size && startX + psize > b.x) continue;
    px = movingRight ? b.x - psize : b.x + b.size;
  }

  // The platform blocks from the sides too: leave by the nearer edge rather
  // than being thrown across it.
  if (overlapsRect(platX, PLAT_Y, PLAT_W, PLAT_H)) {
    const nearLeft = (px + psize) - platX <= (platX + PLAT_W) - px;
    px = nearLeft ? platX - psize : platX + PLAT_W;
  }

  if (px < 0) px = 0;
  if (px > WORLD_W - psize) px = WORLD_W - psize;

  // In the water when horizontally over it and dipping below the surface.
  const inWater = px + psize > WATER_X && px < WATER_X + WATER_W && py + psize > WATER_Y;

  // ---- Jump, edge-triggered so a tap works on land and in water ----
  const jumpPressed = keyJump && !prevJump;
  if (jumpPressed && onGround) {
    vy = JUMP_VELOCITY;
    onGround = false;
    onPlatform = false;
    onYellow = false;
    audio.play(SFX_JUMP);
  } else if (jumpPressed && inWater) {
    vy = WATER_JUMP;
    audio.play(SFX_JUMP);
  }
  prevJump = keyJump;

  // ---- Vertical movement + collision ----
  if (inWater) {
    // Buoyant swimming: bob at the surface, hold up to climb out.
    vy += WATER_GRAVITY;
    vy *= WATER_DRAG;
    const floatY = WATER_Y - psize * 0.4 + Math.sin(time * 4) * 2;
    if (py > floatY) vy += (floatY - py) * BUOYANCY;
    if (keyJump) vy -= SWIM_UP;
  } else {
    vy += GRAVITY;
  }

  // A single step must never carry the player clean past a solid.
  const maxStep = CELL + psize - 1;
  vy = clamp(vy, -maxStep, maxStep);

  prevPy = py;
  py += vy;
  onGround = false;
  onPlatform = false;
  onYellow = false;

  for (const b of blocks) {
    if (b.off || !overlapsRect(b.x, b.y, b.size, b.size)) continue;
    if (resolveToTop(b.y, b.size)) {
      py = b.y - psize;
      vy = 0;
      onGround = true;
      if (b.kind === YELLOW) onYellow = true;
    } else {
      py = b.y + b.size;
      if (vy < 0) vy = 0;                      // stop a rising bonk, keep a fall falling
    }
  }

  // The moving platform, solid on both faces, same came-from rule.
  if (overlapsRect(platX, PLAT_Y, PLAT_W, PLAT_H)) {
    if (resolveToTop(PLAT_Y, PLAT_H)) {
      py = PLAT_Y - psize;
      vy = 0;
      onGround = true;
      onPlatform = true;
    } else {
      py = PLAT_Y + PLAT_H;
      if (vy < 0) vy = 0;
    }
  }

  const floorY = WORLD_H - psize;
  if (py >= floorY) {
    py = floorY;
    vy = 0;
    onGround = true;
  }

  // The bar drains in the water and never comes back on land.
  if (inWater) {
    hp -= DROWN_RATE;
    if (hp <= 0) {
      hp = 0;
      showDeath(DEATH_WATER);
    }
  }
}

// ---- Shiny line: crossing it shrinks the player to one red-grid piece ----
const LINE_COL = 30, LINE_TOP_ROW = 23, LINE_BOTTOM_ROW = 29;
const LINE_X = LINE_COL * CELL - 1;    // the CSS pulled it 1px left of the cell edge
const LINE_TOP_Y = LINE_TOP_ROW * CELL;
const LINE_BOTTOM_Y = (LINE_BOTTOM_ROW + 1) * CELL;
const LINE_W = 3;

// Shrink to a red-grid cell while right of the line, restore on the left.
// Only the drawn segment counts: passing above or below it leaves the size alone.
function checkShinyLine(scattered) {
  if (scattered) return;
  if (py < LINE_BOTTOM_Y && py + psize > LINE_TOP_Y) {
    const want = px >= LINE_X + 1 ? SMALL_SIZE : NORMAL_SIZE;
    if (want !== psize) {
      audio.play(SFX_WARP, want > psize);   // a rising note on the way back to full size
      psize = want;
    }
  }
}

// The line's white-to-lavender bar, baked once; its glow pulses behind it.
const lineSprite = makeLayer(LINE_W, LINE_BOTTOM_Y - LINE_TOP_Y);
(function bakeLine() {
  const g = lineSprite.getContext('2d');
  const gradient = g.createLinearGradient(0, 0, 0, lineSprite.height);
  gradient.addColorStop(0, hex(0xffffff));
  gradient.addColorStop(1, hex(0xc9d2ff));
  g.fillStyle = gradient;
  g.fillRect(0, 0, LINE_W, lineSprite.height);
})();

function drawBorderLine() {
  drawGlow(glowPlayer, LINE_X, LINE_TOP_Y, LINE_W, lineSprite.height, 2, pulse());
  ctx.drawImage(lineSprite, LINE_X, LINE_TOP_Y);
}

// ---- Projectiles ----
// A shot is a piece of the player, not something it carries: firing tears one
// red-grid square off the body and throws it the way they face. Ammunition and
// body are the same sixteen squares.
const SHOT_SIZE = SMALL_SIZE;          // 5, one part
const SHOT_SPEED = 7;                  // px per frame, just over twice the walk
const PART_SPAN = NORMAL_SIZE / FINE;  // 4 parts a side
const PART_COUNT = PART_SPAN * PART_SPAN;   // 16
const SHOT_GONE = 0, SHOT_FLYING = 1, SHOT_FALLING = 2, SHOT_LANDED = 3;

const shots = [];                      // one slot per part, held from firing to lying on the ground
for (let i = 0; i < PART_COUNT; i++) shots.push({ x: 0, y: 0, vx: 0, vy: 0, state: SHOT_GONE, cell: 0 });
const partGone = new Array(PART_COUNT).fill(false);   // the body, square by square: fired or still on
let prevShoot = true;                  // the trigger is edge-triggered: one press, one shot

function partsLeft() {
  let n = 0;
  for (let i = 0; i < PART_COUNT; i++) if (!partGone[i]) n++;
  return n;
}

// Nothing of the player is still moving: every piece has come to rest or been lost.
function piecesSettled() {
  for (const shot of shots) if (shot.state === SHOT_FLYING || shot.state === SHOT_FALLING) return false;
  return true;
}

// Which part goes next: the front column first, top down, then the column
// behind it — the player is eaten away from the face they're pointing.
// Returns its index (row * PART_SPAN + col), or -1 once nothing is left.
function nextPart() {
  for (let i = 0; i < PART_SPAN; i++) {
    const col = faceDir > 0 ? PART_SPAN - 1 - i : i;
    for (let row = 0; row < PART_SPAN; row++) {
      if (!partGone[row * PART_SPAN + col]) return row * PART_SPAN + col;
    }
  }
  return -1;
}

// Tears off the next part and sends it. One slot per part, so there's never a
// shot without a part behind it.
function fireShot() {
  const i = nextPart();
  if (i < 0) return;
  partGone[i] = true;
  const row = Math.floor(i / PART_SPAN), col = i % PART_SPAN;

  // It leaves from where it sat: the part's own square at full size, or from
  // the single square the shrunken player is.
  let x = px, y = py;
  if (psize > FINE) {
    x += col * FINE;
    y += row * FINE;
  }
  const shot = shots[i];
  shot.x = x;
  shot.y = y;
  shot.vx = faceDir * SHOT_SPEED;
  shot.vy = 0;
  shot.state = SHOT_FLYING;
  audio.play(SFX_SHOT);
}

// The 20px cell a point falls in, numbered the way the level is written.
function cellOf(x, y) {
  const col = clamp(Math.floor(x / CELL), 0, COLS - 1);
  const row = clamp(Math.floor(y / CELL), 0, ROWS - 1);
  return row * COLS + col + 1;
}

function pileCount(cell) {
  let n = 0;
  for (const shot of shots) if (shot.state === SHOT_LANDED && shot.cell === cell) n++;
  return n;
}

// The shot stops at anything the player would. 5px against a 20px cell, so
// there's nothing here it can tunnel through.
function shotBlocked(x, y) {
  for (const b of blocks) {
    if (b.off) continue;
    if (x < b.x + b.size && x + SHOT_SIZE > b.x && y < b.y + b.size && y + SHOT_SIZE > b.y) return true;
  }
  return false;
}

// The poison takes a piece the way it takes the player; also the only hole in
// the level's floor.
function pieceLost(x, y) {
  if (y > WORLD_H) return true;
  return x + SHOT_SIZE > WATER_X && x < WATER_X + WATER_W && y + SHOT_SIZE > WATER_Y;
}

// The highest surface the fall crossed, or -1 if it crossed none — swept rather
// than an overlap test, since a quick fall can step clean over a 5px block.
function pieceLanding(x, prevY, y) {
  let landY = WORLD_H;
  for (const b of blocks) {
    if (b.off) continue;
    if (x >= b.x + b.size || x + SHOT_SIZE <= b.x) continue;
    if (prevY + SHOT_SIZE > b.y) continue;       // already below this top
    landY = Math.min(landY, b.y);
  }
  return y + SHOT_SIZE > landY ? landY : -1;
}

// The sixteen pieces are a player again, standing in the cell they filled.
// This moves you; it doesn't heal you.
function reformAt(cell) {
  px = cellX(cell);
  py = cellY(cell);
  prevPx = px;
  prevPy = py;
  vy = 0;
  psize = NORMAL_SIZE;
  onGround = false;
  onPlatform = false;
  onYellow = false;
  partGone.fill(false);
  for (const shot of shots) shot.state = SHOT_GONE;
  audio.play(SFX_WARP, true);          // the rising note for coming back whole
}

// Comes to rest in the cell it fell into, dropping into the lowest free square
// of the pile there — four across, the layout the player's own parts are in.
function settlePiece(shot, landY) {
  const cell = cellOf(shot.x + SHOT_SIZE / 2, landY - SHOT_SIZE / 2);
  const n = pileCount(cell);
  shot.x = cellX(cell) + (n % PART_SPAN) * FINE;
  shot.y = cellY(cell) + (PART_SPAN - 1 - Math.floor(n / PART_SPAN)) * FINE;
  shot.vy = 0;
  shot.cell = cell;
  shot.state = SHOT_LANDED;
  if (pileCount(cell) === PART_COUNT) reformAt(cell);
}

function updateShots() {
  for (const shot of shots) {
    if (shot.state === SHOT_FLYING) {
      shot.x += shot.vx;
      if (shot.x + SHOT_SIZE < 0 || shot.x > WORLD_W) {
        shot.state = SHOT_GONE;                    // off the level; not coming back
      } else if (shotBlocked(shot.x, shot.y)) {
        shot.x -= shot.vx;                         // back out to the last step that was clear
        shot.vx = 0;
        shot.state = SHOT_FALLING;
      }
    } else if (shot.state === SHOT_FALLING) {
      shot.vy += GRAVITY;
      const prevY = shot.y;
      shot.y += shot.vy;
      if (pieceLost(shot.x, shot.y)) {
        shot.state = SHOT_GONE;
      } else {
        const landY = pieceLanding(shot.x, prevY, shot.y);
        if (landY >= 0) settlePiece(shot, landY);
      }
    }
  }
}

// Everything the level itself does in a frame: the platform, the lift, the
// player's own body, its shots, and the things it can trigger.
function updateGame() {
  if (dead) return;                    // paused behind the death overlay

  // Every part thrown: there's no body to move, and the pieces in the air are
  // the player now. The level goes on running around them.
  const scattered = partsLeft() === 0;

  prevPx = px;                         // the magic platform's trigger needs this frame's direction
  checkShinyLine(scattered);

  // ---- Moving platform ----
  const prevPlatX = platX;
  platX += platDir * PLAT_SPEED;
  if (platX <= PLAT_MIN_X) { platX = PLAT_MIN_X; platDir = 1; }
  if (platX >= PLAT_MAX_X) { platX = PLAT_MAX_X; platDir = -1; }
  platDx = platX - prevPlatX;

  updateMovers();                      // blocks Harry has shot into motion

  // The lift moves on its own; a rider is carried by however far it went.
  yellowDy = moveYellow();
  if (onYellow && !scattered) py += yellowDy;

  if (!scattered) updateWhitesquare();

  // A piece thrown while scattered would have nothing to come from, and the
  // trigger is read anyway so a held Enter can't fire the moment they re-form.
  if (!scattered && keyShoot && !prevShoot) fireShot();
  prevShoot = keyShoot;
  updateShots();

  updateEnemy();                       // the red block hops along its shelf...
  if (!scattered) {
    checkEnemy();                      // ...and takes half the bar off anyone who touches it
    checkMagicTriggers();              // column 28 spawns the 311 platform, row 13 clears it
    checkButtons();                    // touched the button -> click, it goes, the lift starts
    checkCoins();                      // ...and the coins -> they pop away
  }

  // Nothing of them is moving any more and no cell caught the whole sixteen,
  // so there's nowhere left for them to be.
  if (scattered && partsLeft() === 0 && piecesSettled()) showDeath(DEATH_SPENT);
}

// The box around the parts still attached, into remainingBox. The glow follows
// this rather than the square the player started as, so a half-fired body
// doesn't glow like it's still whole. False when nothing is left.
const remainingBox = { x: 0, y: 0, w: 0, h: 0 };
function measureRemaining() {
  if (partsLeft() === 0) return false;
  if (psize <= FINE) {
    remainingBox.x = px; remainingBox.y = py; remainingBox.w = psize; remainingBox.h = psize;
    return true;
  }
  let minR = PART_SPAN, minC = PART_SPAN, maxR = -1, maxC = -1;
  for (let row = 0; row < PART_SPAN; row++) {
    for (let col = 0; col < PART_SPAN; col++) {
      if (partGone[row * PART_SPAN + col]) continue;
      minR = Math.min(minR, row); maxR = Math.max(maxR, row);
      minC = Math.min(minC, col); maxC = Math.max(maxC, col);
    }
  }
  remainingBox.x = px + minC * FINE;
  remainingBox.y = py + minR * FINE;
  remainingBox.w = (maxC - minC + 1) * FINE;
  remainingBox.h = (maxR - minR + 1) * FINE;
  return true;
}

// Built out of the red grid: a 4x4 of shiny squares at full size, minus
// whatever has been fired off, or a single square once the line has shrunk it.
function drawWhitesquare() {
  if (!measureRemaining()) return;     // nothing left of them
  const radius = psize > 8 ? 3 : 1;
  drawGlow(glowPlayer, remainingBox.x, remainingBox.y, remainingBox.w, remainingBox.h, radius, pulse());
  if (psize <= FINE) {
    drawPiece(pieceWhite, px, py);
    return;
  }
  for (let row = 0; row < PART_SPAN; row++) {
    for (let col = 0; col < PART_SPAN; col++) {
      if (!partGone[row * PART_SPAN + col]) drawPiece(pieceWhite, px + col * FINE, py + row * FINE);
    }
  }
}

// Shots wear the player's gradient with a harder white glow, and a short
// trailing streak while flying.
function drawShots() {
  const p = pulse();
  for (const shot of shots) {
    if (shot.state === SHOT_GONE) continue;
    if (shot.state === SHOT_FLYING) {
      ctx.fillStyle = '#fff';
      for (let i = 1; i <= 3; i++) {
        const k = 1 - i / 4;
        const backH = SHOT_SIZE * k;
        ctx.globalAlpha = 0.30 * k;
        ctx.fillRect(Math.round(shot.x - shot.vx * i * 0.5), Math.round(shot.y + (SHOT_SIZE - backH) / 2), SHOT_SIZE, Math.round(backH));
      }
      ctx.globalAlpha = 1;
    }
    if (shot.state !== SHOT_LANDED) drawGlow(glowShot, shot.x, shot.y, SHOT_SIZE, SHOT_SIZE, 1, p);
    drawPiece(pieceWhite, shot.x, shot.y);
  }
}

// ---- Hazards & interactables (step 5) ----

// Mouse: the click latched by the last drainInput(), consumed by whichever
// control it lands on so a click never falls through to what's underneath.
let clicked = false;
function consumeClick() {
  if (!clicked) return false;
  clicked = false;
  return true;
}

// ---- Death ----
// What killed you, so the card can say so.
const DEATH_WATER = 0, DEATH_ENEMY = 1, DEATH_SPENT = 2;
const DEATH_COPY = [
  ['You drowned', 'Your life ran out', 'in the poison water.'],
  ['You were struck down', 'The red block took', 'the last of your life.'],
  ['You came apart', 'Every piece of you landed', 'somewhere else.'],
];
const MAX_HP = 100;
const DROWN_RATE = 0.4;                // hp per frame in the water; it never regenerates
let hp = MAX_HP;
let dead = false;                      // paused behind the death overlay
let deathBy = DEATH_WATER;
let deathT = 0;                        // seconds the overlay has been up

// Dying undoes the run's progress: the coins go back where they were and the
// tally to zero, the button is unpressed, and the lift parks at the top again.
// The 311 platform's state is kept.
function showDeath(cause) {
  if (dead) return;
  dead = true;
  deathBy = cause;
  deathT = 0;
  keyLeft = false;
  keyRight = false;
  keyJump = false;
  spawnCoins();
  coinsTaken = 0;
  spawnButtons();
  resetYellow();
}

// Retry puts the player back, whole. (Java never refilled the bar on retry,
// so a second water touch was instant death; here a new life is a full bar.)
function retry() {
  dead = false;
  hp = MAX_HP;
  resetWhitesquare();
  resetHarry();                        // otherwise a water death leaves Harry standing in the hazard
}

// ---- Sliding green platform (cells 1049-1050, travelling to 1060) ----
const PLAT_W = 2 * CELL, PLAT_H = CELL, PLAT_Y = 26 * CELL;
const PLAT_MIN_X = 8 * CELL, PLAT_MAX_X = 18 * CELL, PLAT_SPEED = 1.2;
let platX = PLAT_MIN_X, platDir = 1, platDx = 0;

function drawPlatform() {
  drawBlock(MOVING, platX, PLAT_Y);
  drawBlock(MOVING, platX + CELL, PLAT_Y);
}

// ---- Yellow lift, started by the button ----
const YELLOW_TOP = 11 * CELL, YELLOW_BOTTOM = 22 * CELL, YELLOW_SPEED = 1.2;
let yellowY = YELLOW_TOP, yellowDir = 1;
let yellowActive = false;
let yellowDy = 0;                     // how far the lift moved this frame, for its riders

// Moves the lift and reports how far it travelled, so a rider standing on it
// can be carried along instead of left behind.
function moveYellow() {
  if (!yellowActive) return 0;
  const prev = yellowY;
  yellowY += yellowDir * YELLOW_SPEED;
  if (yellowY >= YELLOW_BOTTOM) { yellowY = YELLOW_BOTTOM; yellowDir = -1; }
  if (yellowY <= YELLOW_TOP) { yellowY = YELLOW_TOP; yellowDir = 1; }
  for (const b of blocks) if (b.kind === YELLOW) b.y = yellowY;   // collision reads this
  return yellowY - prev;
}

function resetYellow() {
  yellowActive = false;
  yellowY = YELLOW_TOP;
  yellowDir = 1;
  for (const b of blocks) if (b.kind === YELLOW) b.y = YELLOW_TOP;
}

// ---- The button: two 5px blocks on fine cells 14070-14071 ----
const BUTTON_CELLS = [14070, 14071];
const BUTTON_HIT_PAD = 4;              // the blocks are tiny, so a click a few px off still counts
const buttons = BUTTON_CELLS.map(() => ({ x: 0, y: 0, alive: false }));
const buttonSprite = makePieceSprite(FINE, 0xd99b00, 0xffd94d, 0xfff6c2);

function spawnButtons() {
  for (let i = 0; i < BUTTON_CELLS.length; i++) {
    buttons[i].x = fineX(BUTTON_CELLS[i]);
    buttons[i].y = fineY(BUTTON_CELLS[i]);
    buttons[i].alive = true;
  }
}

// Touching one: both blocks go and the lift starts.
function clearButtons() {
  if (!buttons.some((b) => b.alive)) return;
  for (const b of buttons) b.alive = false;
  yellowActive = true;
  audio.play(SFX_TYPE);
}

function checkButtons() {
  for (const b of buttons) {
    if (b.alive && overlapsRect(b.x, b.y, FINE, FINE)) {
      clearButtons();
      return;
    }
  }
}

// Clicking one works too.
function clickButtons() {
  for (const b of buttons) {
    if (!b.alive) continue;
    const bx = b.x - BUTTON_HIT_PAD, by = b.y - BUTTON_HIT_PAD, bs = FINE + 2 * BUTTON_HIT_PAD;
    if (mouseX >= bx && mouseX < bx + bs && mouseY >= by && mouseY < by + bs && consumeClick()) {
      clearButtons();
      return;
    }
  }
}

function drawButtons() {
  const p = pulse();
  for (const b of buttons) {
    if (!b.alive) continue;
    drawGlow(glowButton, b.x, b.y, FINE, FINE, 1, p);
    drawPiece(buttonSprite, b.x, b.y);
  }
}

// ---- The platform that appears on cell 469 ----
// Cross column 28 anywhere between cells 28 and 268 left-to-right and it
// appears; fall through row 13 a row below where it sits, and it goes away.
const MAGIC_ON = { x: 27 * CELL, y: 0, w: CELL, h: 7 * CELL };
const MAGIC_OFF = { x: 25 * CELL, y: 12 * CELL, w: 15 * CELL, h: CELL };
const MAGIC_FADE = 0.18;               // seconds, the CSS transition
let magicAnim = 0;                     // 0 gone, 1 fully there

function setMagicPlatform(on) {
  for (const b of blocks) if (b.kind === MAGIC) b.off = !on;
}

function magicOn() {
  for (const b of blocks) if (b.kind === MAGIC) return !b.off;
  return false;
}

// Crossing the trigger column is a two-way switch: left-to-right brings the
// platform in, right-to-left takes it away. Standing still changes nothing.
function checkMagicTriggers() {
  if (overlapsRect(MAGIC_ON.x, MAGIC_ON.y, MAGIC_ON.w, MAGIC_ON.h)) {
    const dx = px - prevPx;
    if (dx > 0) setMagicPlatform(true);
    else if (dx < 0) setMagicPlatform(false);
  }
  // only on the way down: walking along row 9 shouldn't clear it
  if (vy > 0 && overlapsRect(MAGIC_OFF.x, MAGIC_OFF.y, MAGIC_OFF.w, MAGIC_OFF.h)) setMagicPlatform(false);

  const target = magicOn() ? 1 : 0;
  const step = STEP / MAGIC_FADE;
  magicAnim += clamp(target - magicAnim, -step, step);
}

// ---- Poison water (cells 1167-1181) ----
const WATER_GRAVITY = 0.12, WATER_DRAG = 0.85, BUOYANCY = 0.08;
const SWIM_UP = 0.85, WATER_JUMP = -9;

// The body: a vertical gradient, and a 1px border drawn over the waves.
const waterBodySprite = makeLayer(WATER_W, WATER_H);
const waterBorderSprite = makeLayer(WATER_W + 1, WATER_H + 1);
(function bakeWaterFrame() {
  const g = waterBodySprite.getContext('2d');
  const gradient = g.createLinearGradient(0, 0, 0, WATER_H);
  gradient.addColorStop(0, 'rgba(120,235,165,' + 140 / 255 + ')');
  gradient.addColorStop(1, 'rgba(55,190,120,' + 199 / 255 + ')');
  g.fillStyle = gradient;
  g.fillRect(0, 0, WATER_W, WATER_H);
  const b = waterBorderSprite.getContext('2d');
  b.fillStyle = 'rgba(120,255,150,' + 60 / 255 + ')';
  b.fillRect(0, 0, WATER_W + 1, 1);
  b.fillRect(0, 0, 1, WATER_H + 1);
  b.fillRect(WATER_W, 0, 1, WATER_H + 1);
  b.fillRect(0, WATER_H, WATER_W + 1, 1);
})();

// The CSS floated two repeating crests over the body at different speeds, one
// drifting right and one left. Each is a plain sine, so it is baked once as a
// strip one period wider than the water; per frame the strip is slid along by
// whole pixels instead of redrawing 300 columns.
function makeWave(period, band, amp, color) {
  const strip = makeLayer(WATER_W + period, band);
  const g = strip.getContext('2d');
  g.fillStyle = color;
  for (let x = 0; x < strip.width; x++) {
    const y = Math.round(band / 2 - amp * Math.sin(2 * Math.PI * x / period));
    g.fillRect(x, y, 1, band - y);
  }
  return { strip, period, band };
}
const waveNear = makeWave(64, 14, 3.5, 'rgba(214,255,228,' + 166 / 255 + ')');
const waveFar = makeWave(96, 12, 3, 'rgba(52,196,122,' + 128 / 255 + ')');

// Draws `wave` drifting at `phase` periods (the scroll is phase * period px).
function drawWave(wave, phase) {
  const shift = Math.floor(((phase * wave.period) % wave.period + wave.period) % wave.period);
  ctx.drawImage(wave.strip, shift, 0, WATER_W, wave.band, WATER_X, WATER_Y, WATER_W, wave.band);
}

function drawWater() {
  ctx.drawImage(waterBodySprite, WATER_X, WATER_Y);
  drawWave(waveNear, -time / 2.6);
  drawWave(waveFar, time / 4.4);
  ctx.drawImage(waterBorderSprite, WATER_X, WATER_Y);
}

// ---- Coins ----
const COIN_CELLS = [265, 714, 359, 522];   // 359/522 sit on the 399/562 ledges
const COIN_SIZE = 14;                  // a little smaller than its cell
const COIN_POP = 0.32;                 // seconds of the pickup animation
const coins = COIN_CELLS.map(() => ({ x: 0, y: 0, alive: false }));
const coinPops = [0, 1, 2, 3].map(() => ({ x: 0, y: 0, t: 0, active: false }));
let coinsTaken = 0;

function spawnCoins() {
  for (let i = 0; i < COIN_CELLS.length; i++) {
    coins[i].x = cellX(COIN_CELLS[i]) + (CELL - COIN_SIZE) / 2;
    coins[i].y = cellY(COIN_CELLS[i]) + (CELL - COIN_SIZE) / 2;
    coins[i].alive = true;
  }
  for (const pop of coinPops) pop.active = false;
}

// Remove the coin, add it to the tally, and start a pop where it sat.
function takeCoin(coin) {
  coin.alive = false;
  coinsTaken++;
  audio.play(SFX_COIN);
  if (coinsTaken === COIN_CELLS.length) unlockLevels();   // every coin in one run (dying resets the tally)
  for (const pop of coinPops) {
    if (!pop.active) {
      pop.x = coin.x;
      pop.y = coin.y;
      pop.t = 0;
      pop.active = true;
      break;
    }
  }
}

function checkCoins() {
  for (const coin of coins) {
    if (coin.alive && overlapsRect(coin.x, coin.y, COIN_SIZE, COIN_SIZE)) takeCoin(coin);
  }
  for (const pop of coinPops) {
    if (!pop.active) continue;
    pop.t += STEP;
    if (pop.t >= COIN_POP) pop.active = false;
  }
}

function fillEllipse(cx, cy, rx, ry, color) {
  ctx.fillStyle = color;
  ctx.beginPath();
  ctx.ellipse(cx, cy, Math.max(rx, 0), Math.max(ry, 0), 0, 0, 2 * Math.PI);
  ctx.fill();
}

function drawCoinFace(cx, cy, rx, ry, alpha) {
  if (alpha <= 0.01) return;
  ctx.globalAlpha = alpha;
  fillEllipse(cx, cy, Math.max(rx, 0.5), ry, '#d99b00');
  fillEllipse(cx, cy, Math.max(rx - 1, 0.4), ry - 1, '#ffd94d');
  fillEllipse(cx - rx * 0.3, cy - ry * 0.35, Math.max(rx * 0.35, 0.4), ry * 0.3, '#fff6c2');
  ctx.globalAlpha = 1;
}

// The CSS spun a flat disc with rotateY, so it squashes edge-on twice a turn:
// the horizontal radius is a cosine.
function drawCoins() {
  const spin = Math.cos(2 * Math.PI * time / 1.2);
  for (const coin of coins) {
    if (!coin.alive) continue;
    drawCoinFace(coin.x + COIN_SIZE / 2, coin.y + COIN_SIZE / 2, COIN_SIZE / 2 * Math.abs(spin), COIN_SIZE / 2, 1);
  }
  // pickups: scale to 1.8 and rise 14px as they fade out
  for (const pop of coinPops) {
    if (!pop.active) continue;
    const k = pop.t / COIN_POP;
    const rx = COIN_SIZE / 2 * (1 + 0.8 * k);
    drawCoinFace(pop.x + COIN_SIZE / 2, pop.y + COIN_SIZE / 2 - 14 * k, rx, rx, 1 - k);
  }
}

// ---- Lifebar (cells 48-55) and coin tally ----
const LIFEBAR = { x: 7 * CELL, y: 1 * CELL, w: 8 * CELL, h: CELL };
const LIFEBAR_INNER_W = LIFEBAR.w - 4;
const lifebarFill = makeLayer(LIFEBAR_INNER_W, LIFEBAR.h - 4);   // gradient baked once, stretched to the hp
(function bakeLifebarFill() {
  const g = lifebarFill.getContext('2d');
  const gradient = g.createLinearGradient(0, 0, LIFEBAR_INNER_W, 0);
  gradient.addColorStop(0, hex(0xd61f1f));
  gradient.addColorStop(1, hex(0xff6b6b));
  g.fillStyle = gradient;
  g.fillRect(0, 0, lifebarFill.width, lifebarFill.height);
})();

// Bakes the parts of the HUD that never change (the bar's frame and the coin
// icon) into `g`, the level's static layer.
function bakeHud(g) {
  g.fillStyle = 'rgba(0,0,0,' + 89 / 255 + ')';
  g.strokeStyle = 'rgba(255,255,255,' + 64 / 255 + ')';
  g.lineWidth = 1;
  g.beginPath();
  g.roundRect(LIFEBAR.x, LIFEBAR.y, LIFEBAR.w, LIFEBAR.h, 4);
  g.fill();
  g.stroke();

  const iconX = LIFEBAR.x + LIFEBAR.w + 8, iconY = LIFEBAR.y + CELL / 2;
  const disc = (cx, cy, r, color) => {
    g.fillStyle = color;
    g.beginPath();
    g.ellipse(cx, cy, r, r, 0, 0, 2 * Math.PI);
    g.fill();
  };
  disc(iconX + 6, iconY, 6, '#a87400');
  disc(iconX + 6, iconY, 5, '#ffd94d');
  disc(iconX + 4, iconY - 2, 2, '#fff6c2');
}

function drawLifebar() {
  const innerW = LIFEBAR_INNER_W * Math.max(hp, 0) / MAX_HP;
  if (innerW > 1) ctx.drawImage(lifebarFill, LIFEBAR.x + 2, LIFEBAR.y + 2, innerW, lifebarFill.height);
}

function drawCoinCounter() {
  ctx.font = 'bold 14px ' + FONT_FAMILY;
  ctx.textAlign = 'left';
  ctx.textBaseline = 'alphabetic';
  ctx.fillStyle = hex(0xffe27a);
  ctx.fillText('x ' + coinsTaken, LIFEBAR.x + LIFEBAR.w + 8 + 17, LIFEBAR.y + CELL / 2 + 5);
}

// ---- Shoot-to-toggle block movers ----
// A bullet from Harry that lands on a block runs this (step 7 fires them).
// The yellow lift toggles its own run state; any other block with a `mover`
// pattern starts or stops it.
function blockShot(b) {
  if (b.kind === YELLOW) {
    yellowActive = !yellowActive;
    audio.play(SFX_TYPE);
    return;
  }
  if (b.mover === MOVER_NONE) return;
  // Stopping leaves the block frozen where it is rather than snapping home;
  // moveT is kept, so a later shot resumes from the same point in its loop.
  b.moving = !b.moving;
  audio.play(SFX_TYPE);
}

function updateMovers() {
  for (const b of blocks) {
    if (b.mover === MOVER_NONE || !b.moving) continue;
    b.moveT += STEP;
    if (b.mover === MOVER_UP_DOWN_1) {
      // one cell up from home and back, a smooth 2s loop
      b.x = b.homeX;
      b.y = b.homeY - (CELL / 2) * (1 - Math.cos(Math.PI * b.moveT));
    } else if (b.mover === MOVER_DOWN_UP_8) {
      // eight cells down from home and back (cell 305 -> 625), a smooth 4s loop
      b.x = b.homeX;
      b.y = b.homeY + 4 * CELL * (1 - Math.cos(Math.PI * b.moveT / 2));
    }
  }
}

function resetMovers() {
  for (const b of blocks) {
    if (b.mover === MOVER_NONE) continue;
    b.moving = false;
    b.moveT = 0;
    b.x = b.homeX;
    b.y = b.homeY;
  }
}

// ---- The hopping enemy (fine cell 12012) ----
// A red twin of the player: the same 5px block the red grid is drawn in, sat
// on the row-19 shelf. It runs the player's own physics — same gravity, a
// shorter jump — and hops from one end of its shelf to the other.
const ENEMY_CELL = 12012;
const ENEMY_SIZE = FINE;               // 5, one red-grid cell
const ENEMY_SPEED = 1.1;               // px per frame
const ENEMY_JUMP = -6.5;               // about half the player's hop
const ENEMY_HIT = MAX_HP / 2;          // half the bar, so two touches are fatal
const ENEMY_GRACE = 1;                 // seconds before it can hit again
let enemyX = 0, enemyY = 0, enemyVy = 0, enemyDir = 1;
let enemyMinX = 0, enemyMaxX = 0;      // the ends of the shelf it patrols
let hitCooldown = 0;                   // seconds of grace after a touch

// Ground below and nothing above: the shelf runs into the left wall, whose
// blocks are on the same row, and walking on those would put the enemy inside
// the column standing on top of them.
function enemyWalkable(x, rowY) {
  return blockAt(x, rowY) && !blockAt(x, rowY - CELL);
}

// Placed when the level opens. The patrol ends are read off the level rather
// than written down: it walks out from the cell it was dropped on for as long
// as there's a block under the next one along.
function spawnEnemy() {
  enemyX = fineX(ENEMY_CELL);
  enemyY = fineY(ENEMY_CELL);
  enemyVy = 0;
  enemyDir = 1;
  hitCooldown = 0;

  const rowY = Math.floor((enemyY + ENEMY_SIZE) / CELL) * CELL;   // the ground it stands on
  const here = Math.floor(enemyX / CELL) * CELL;
  let left = here;
  while (enemyWalkable(left - CELL, rowY)) left -= CELL;
  let right = here;
  while (enemyWalkable(right + CELL, rowY)) right += CELL;
  enemyMinX = left;
  enemyMaxX = right + CELL - ENEMY_SIZE;
}

function updateEnemy() {
  enemyVy += GRAVITY;
  // The same anti-tunnelling bound as the player, fixed since it never resizes.
  const maxStep = CELL + ENEMY_SIZE - 1;
  enemyVy = clamp(enemyVy, -maxStep, maxStep);

  enemyX += enemyDir * ENEMY_SPEED;
  if (enemyX <= enemyMinX) { enemyX = enemyMinX; enemyDir = 1; }
  if (enemyX >= enemyMaxX) { enemyX = enemyMaxX; enemyDir = -1; }

  const prevY = enemyY;
  enemyY += enemyVy;

  let onGroundNow = false;
  for (const b of blocks) {
    if (b.off) continue;
    if (enemyX >= b.x + b.size || enemyX + ENEMY_SIZE <= b.x) continue;
    if (enemyY >= b.y + b.size || enemyY + ENEMY_SIZE <= b.y) continue;
    // Same came-from rule the player uses, for the same reason.
    if (prevY + ENEMY_SIZE <= b.y) {
      enemyY = b.y - ENEMY_SIZE;
      enemyVy = 0;
      onGroundNow = true;
    } else if (prevY >= b.y + b.size) {
      enemyY = b.y + b.size;
      if (enemyVy < 0) enemyVy = 0;
    }
  }
  if (onGroundNow) enemyVy = ENEMY_JUMP;   // straight back up: it never rests
}

// Touching it costs half the bar. The grace period is what makes that one hit
// rather than one per frame.
function checkEnemy() {
  if (hitCooldown > 0) {
    hitCooldown -= STEP;
    return;
  }
  if (!overlapsRect(enemyX, enemyY, ENEMY_SIZE, ENEMY_SIZE)) return;
  audio.play(SFX_PUNCH);
  hp -= ENEMY_HIT;
  hitCooldown = ENEMY_GRACE;
  if (hp <= 0) {
    hp = 0;
    showDeath(DEATH_ENEMY);
  }
}

// Same shiny treatment as the player and the button, in red.
function drawEnemy() {
  drawGlow(glowEnemy, enemyX, enemyY, ENEMY_SIZE, ENEMY_SIZE, 1, pulse());
  drawPiece(pieceRed, enemyX, enemyY);
}

// ---- Portal (cell 203): shiny border, nothing inside ----
// Harry touching it is handled in updateHarry/drawHarry, which spin him down
// into this cell.
const PORTAL_CELL = 203;
const portalSprite = makeLayer(CELL + 4, CELL + 4);      // the framed black square, 2px of margin for the stroke
(function bakePortal() {
  const g = portalSprite.getContext('2d');
  g.fillStyle = '#000';
  g.strokeStyle = hex(0xeef2ff);
  g.lineWidth = 2;
  g.beginPath();
  g.roundRect(2, 2, CELL, CELL, 3);
  g.fill();
  g.stroke();
})();

function drawPortal() {
  const x = cellX(PORTAL_CELL), y = cellY(PORTAL_CELL);
  drawGlow(glowPortal, x, y, CELL, CELL, 3, pulse());
  ctx.drawImage(portalSprite, x - 2, y - 2);
}

// ---- Second player: Harry, a Pitfall-style character ----
// A red-grid twin of the player, stood on his own ledge (cells 209..219).
// Built from 5px red-grid squares. Click him (or press Tab) and the keys drive
// him while the white square holds still; click the square (or Tab again) to
// hand control back. While he's selected a click fires a bullet at the pointer.
const HARRY_SPAWN_CELL = 213;
const HARRY_STAND_W = 4 * FINE;        // 20, four red-grid squares across
const HARRY_STAND_H = 9 * FINE;        // 45
const HARRY_CROUCH_H = 6 * FINE;       // 30
const HARRY_PRONE_W = 6 * FINE;        // 30
const HARRY_PRONE_H = 3 * FINE;        // 15
const HARRY_SPEED = 2.6;               // px per frame
const HARRY_PRONE_SPEED = 1.2;
const HARRY_JUMP = -11;
const HARRY_WARP_DUR = 0.95;           // seconds drawn down into the cell-203 portal
const HARRY_WARP_GAP = 0.45;           // ...then this long fully gone before respawning
const HARRY_WARP_SPINS = 2.5;          // turns around the portal centre on the way in
const HARRY_BULLET_MAX = 12;
const HARRY_BULLET_SIZE = FINE;
const HARRY_BULLET_SPEED = 6;          // px per frame
const HARRY_ARM_SEGS = 3;              // red-grid squares in the aiming arm
const HARRY_ARM_LEN = HARRY_ARM_SEGS * FINE;

const ANIM_IDLE = 0, ANIM_RUN = 1, ANIM_JUMP = 2, ANIM_CROUCH = 3, ANIM_PRONE = 4, ANIM_PRONE_MOVE = 5;
const ANIM_NAMES = ['idle', 'running', 'jumping', 'crouch', 'prone', 'prone move'];

const harry = {
  x: 0, y: 0, w: HARRY_STAND_W, h: HARRY_STAND_H, vy: 0, faceDir: 1,
  onGround: false, onPlatform: false, onYellow: false, prevJump: false,
  selected: false, anim: ANIM_IDLE, animT: 0, crouchT: 0,
  warping: false, warpT: 0, hitCooldown: 0,
  bullets: Array.from({ length: HARRY_BULLET_MAX }, () => ({ x: 0, y: 0, vx: 0, vy: 0, alive: false })),
};

function resetHarry() {
  if (screen === SCREEN_LEVEL3 || screen === SCREEN_LEVEL4) {
    // level 3: the middle of the empty room; level 4: the bottom-left corner, by the first ledge.
    harry.x = (screen === SCREEN_LEVEL3 ? COLS / 2 : 2) * CELL;
    harry.y = (ROWS - 1) * CELL - HARRY_STAND_H;          // feet on the bottom border
  } else {
    harry.x = cellX(HARRY_SPAWN_CELL);
    harry.y = cellY(HARRY_SPAWN_CELL) - HARRY_STAND_H;    // feet on top of his ledge
  }
  harry.w = HARRY_STAND_W;
  harry.h = HARRY_STAND_H;
  harry.vy = 0;
  harry.faceDir = 1;
  harry.onGround = false;
  harry.onPlatform = false;
  harry.onYellow = false;
  harry.prevJump = false;
  harry.anim = ANIM_IDLE;
  harry.animT = 0;
  harry.crouchT = 0;
  harry.warping = false;
  harry.warpT = 0;
  harry.hitCooldown = 0;
  harry.selected = true;               // a level opens with Harry driving, not the white square
  for (const bullet of harry.bullets) bullet.alive = false;
}

// The box each pose fills: crouch is shorter, prone shorter still and wider.
let poseW = HARRY_STAND_W, poseH = HARRY_STAND_H;
function measurePose(anim) {
  if (anim === ANIM_PRONE || anim === ANIM_PRONE_MOVE) { poseW = HARRY_PRONE_W; poseH = HARRY_PRONE_H; }
  else if (anim === ANIM_CROUCH) { poseW = HARRY_STAND_W; poseH = HARRY_CROUCH_H; }
  else { poseW = HARRY_STAND_W; poseH = HARRY_STAND_H; }
}

// The mouse: click the white square to hand control back; otherwise, while
// Harry is selected, a click fires a bullet toward that point; and a click on
// Harry (when he isn't selected) picks him. Tab toggles. Nothing here eats a
// click it didn't act on, so the level's own buttons still work.
function harryHandleSelect() {
  // A click on the Back button is UI chrome, not a shot at the world.
  if (hovered(BACK_RECT.x, BACK_RECT.y, BACK_RECT.w, BACK_RECT.h)) return;

  if (screen === SCREEN_LEVEL3 || screen === SCREEN_LEVEL4) {
    // Harry is the only character here: always driving, click to fire.
    harry.selected = true;
    if (clicked && !harry.warping) {
      harryFire(mouseX, mouseY);
      clicked = false;
    }
    return;
  }
  if (screen !== SCREEN_LEVEL1 || dead) return;

  if (pressed.tab) harry.selected = !harry.selected;
  if (!clicked) return;

  const overPlayer = mouseX >= px && mouseX < px + psize && mouseY >= py && mouseY < py + psize;
  const overHarry = mouseX >= harry.x && mouseX < harry.x + harry.w && mouseY >= harry.y && mouseY < harry.y + harry.h;
  if (overPlayer) {
    harry.selected = false;
    clicked = false;
  } else if (harry.selected && !harry.warping) {
    harryFire(mouseX, mouseY);
    clicked = false;
  } else if (overHarry) {
    harry.selected = true;
    clicked = false;
  }
}

// The leading shoulder (the aiming arm's root) into shoulderX/Y, and the unit
// vector from it toward a target into aimX/Y — falling back to the facing
// direction if the target is right on top of it.
let shoulderX = 0, shoulderY = 0, aimX = 1, aimY = 0;
function aimHarryAt(targetX, targetY) {
  shoulderX = harry.x + harry.w / 2 + harry.faceDir * (harry.w / 2 - FINE / 2);
  shoulderY = harry.y + harry.h * 0.28;
  const dx = targetX - shoulderX, dy = targetY - shoulderY;
  const d = Math.sqrt(dx * dx + dy * dy);
  if (d < 0.001) { aimX = harry.faceDir; aimY = 0; }
  else { aimX = dx / d; aimY = dy / d; }
}

// Fire one bullet from the tip of the aiming arm, straight at the clicked point.
function harryFire(targetX, targetY) {
  aimHarryAt(targetX, targetY);
  if (Math.abs(aimX) > 0.15) harry.faceDir = aimX > 0 ? 1 : -1;
  aimHarryAt(targetX, targetY);        // the shoulder moves with the facing
  const muzzleX = shoulderX + aimX * HARRY_ARM_LEN - HARRY_BULLET_SIZE / 2;
  const muzzleY = shoulderY + aimY * HARRY_ARM_LEN - HARRY_BULLET_SIZE / 2;
  for (const bullet of harry.bullets) {
    if (bullet.alive) continue;
    bullet.x = muzzleX;
    bullet.y = muzzleY;
    bullet.vx = aimX * HARRY_BULLET_SPEED;
    bullet.vy = aimY * HARRY_BULLET_SPEED;
    bullet.alive = true;
    audio.play(SFX_SHOT);
    return;
  }
}

// Bullets fly straight and die on the first solid they touch — any level
// block, the sliding platform, or the edge of the world.
function updateHarryBullets() {
  for (const bullet of harry.bullets) {
    if (!bullet.alive) continue;
    bullet.x += bullet.vx;
    bullet.y += bullet.vy;
    if (bullet.x + HARRY_BULLET_SIZE < 0 || bullet.x > WORLD_W || bullet.y + HARRY_BULLET_SIZE < 0 || bullet.y > WORLD_H) {
      bullet.alive = false;
      continue;
    }
    let hit = false;
    const l1 = screen === SCREEN_LEVEL1;
    for (const b of harrySolids()) {
      if (b.off) continue;
      if (bullet.x < b.x + b.size && bullet.x + HARRY_BULLET_SIZE > b.x
          && bullet.y < b.y + b.size && bullet.y + HARRY_BULLET_SIZE > b.y) {
        hit = true;
        if (l1) {
          blockShot(b);                // a shot block starts or stops moving
        } else if (b.mover === MOVER_SHIFT) {
          level3ShiftOn = !level3ShiftOn;   // both SHIFT blocks move together
          audio.play(SFX_TYPE);
        }
        break;
      }
    }
    if (!hit && l1 && bullet.x < platX + PLAT_W && bullet.x + HARRY_BULLET_SIZE > platX
        && bullet.y < PLAT_Y + PLAT_H && bullet.y + HARRY_BULLET_SIZE > PLAT_Y) {
      hit = true;
    }
    if (hit) bullet.alive = false;
  }
}

// The blocks Harry stands on and shoots, by screen.
function harrySolids() {
  if (screen === SCREEN_LEVEL1) return blocks;
  return screen === SCREEN_LEVEL4 ? level4Blocks : level3Blocks;
}

// Is a Harry-sized box at (x, y) inside something solid?
function harryBoxBlocked(x, y, w, h) {
  for (const b of harrySolids()) {
    if (!b.off && x < b.x + b.size && x + w > b.x && y < b.y + b.size && y + h > b.y) return true;
  }
  return screen === SCREEN_LEVEL1 && x < platX + PLAT_W && x + w > platX && y < PLAT_Y + PLAT_H && y + h > PLAT_Y;
}
