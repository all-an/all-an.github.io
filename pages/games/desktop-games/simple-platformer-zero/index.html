// Can Harry change to a w x h box, feet and centre kept? Tries the centred box
// first, then nudged a few px either way (widening beside a wall). The x that
// fit goes into fitX.
const FIT_NUDGES = [0, -5, 5, -10, 10];
let fitX = 0;
function fitHarryBox(w, h) {
  const top = harry.y + harry.h - h, centreX = harry.x + harry.w / 2;
  for (const nudge of FIT_NUDGES) {
    const x = centreX - w / 2 + nudge;
    if (x < 0 || x + w > WORLD_W) continue;
    if (!harryBoxBlocked(x, top, w, h)) {
      fitX = x;
      return true;
    }
  }
  return false;
}

function harryHitsRect(rx, ry, rw, rh) {
  return harry.x < rx + rw && harry.x + harry.w > rx && harry.y < ry + rh && harry.y + harry.h > ry;
}

// Same shape of loop the player and the hopping enemy run: per-frame
// constants, horizontal move then a came-from vertical resolve against the
// level's blocks.
function updateHarry() {
  if (screen === SCREEN_SELECT || screen === SCREEN_LEVEL2 || dead) return;
  const l1 = screen === SCREEN_LEVEL1;           // levels 3 and 4 have no hazards and no platform
  const solids = harrySolids();
  const h = harry;

  // ---- being swallowed by the cell-203 portal ----
  if (h.warping) {
    h.warpT += STEP;
    if (h.warpT >= HARRY_WARP_DUR + HARRY_WARP_GAP) resetHarry();
    return;
  }

  // ---- input, only while it's the selected character ----
  let left = false, right = false, down = false, jumpHeld = false, proneHeld = false;
  if (h.selected) {
    left = raw.left;
    right = raw.right;
    down = raw.down;
    jumpHeld = raw.jump;
    proneHeld = raw.prone;
  }
  const moving = left !== right;
  if (moving) {
    h.faceDir = right ? 1 : -1;
  } else if (h.selected) {
    // standing still: face the pointer, so body and aiming arm agree
    const mid = h.x + h.w / 2;
    if (Math.abs(mouseX - mid) > 4) h.faceDir = mouseX > mid ? 1 : -1;
  }

  // ---- edge-triggered hop ----
  // He can't hop where he has no room to stand up (a low tunnel).
  let justJumped = false;
  if (h.selected && jumpHeld && !h.prevJump && h.onGround && fitHarryBox(HARRY_STAND_W, HARRY_STAND_H)) {
    h.vy = HARRY_JUMP;
    h.onGround = false;
    h.onPlatform = false;
    h.onYellow = false;
    justJumped = true;
    audio.play(SFX_JUMP);
  }
  h.prevJump = jumpHeld;

  // ---- pick the animation ----
  let anim;
  if (!h.onGround || justJumped) {
    anim = ANIM_JUMP;
  } else if (down || proneHeld) {
    h.crouchT += STEP;
    if (proneHeld || h.crouchT > 0.40) anim = moving ? ANIM_PRONE_MOVE : ANIM_PRONE;
    else anim = ANIM_CROUCH;
  } else {
    h.crouchT = 0;
    anim = moving ? ANIM_RUN : ANIM_IDLE;
  }

  // ---- the pose's box, keeping feet and centre put ----
  // Getting taller (or wider) needs room: prone -> crouch or stand inside a
  // thin gap between blocks would embed him in them and leave him stuck. So a
  // pose that doesn't fit is refused and he stays as small as he is, until he
  // is somewhere with room. Shrinking always fits.
  measurePose(anim);
  let boxX = h.x + h.w / 2 - poseW / 2;
  if (poseW !== h.w || poseH !== h.h) {
    if (poseH > h.h || poseW > h.w) {
      if (fitHarryBox(poseW, poseH)) {
        boxX = fitX;                               // possibly nudged a few px to clear a wall
      } else {
        anim = h.h === HARRY_PRONE_H ? (moving ? ANIM_PRONE_MOVE : ANIM_PRONE) : ANIM_CROUCH;
        measurePose(anim);
        boxX = h.x + h.w / 2 - poseW / 2;
      }
    }
  }
  if (anim !== h.anim) {
    h.anim = anim;
    h.animT = 0;
  } else {
    h.animT += STEP;
  }
  if (poseW !== h.w || poseH !== h.h) {
    const bottom = h.y + h.h;
    h.w = poseW;
    h.h = poseH;
    h.y = bottom - h.h;
    h.x = boxX;
  }

  // ---- horizontal move + collision ----
  let speed = 0;
  if (anim === ANIM_RUN || anim === ANIM_JUMP) speed = HARRY_SPEED;
  else if (anim === ANIM_PRONE_MOVE) speed = HARRY_PRONE_SPEED;
  if (h.onYellow) h.y += yellowDy;     // the lift carries its rider before anything else moves

  const startX = h.x;
  if (h.onPlatform) h.x += platDx;     // the sliding platform carries its rider sideways
  h.x += (right ? speed : 0) - (left ? speed : 0);
  const moved = h.x - startX;
  for (const b of solids) {
    if (b.off || !harryHitsRect(b.x, b.y, b.size, b.size)) continue;
    if (startX < b.x + b.size && startX + h.w > b.x) continue;
    if (moved > 0) h.x = b.x - h.w;
    else if (moved < 0) h.x = b.x + b.size;
  }
  // the sliding platform blocks from the sides too
  if (l1 && harryHitsRect(platX, PLAT_Y, PLAT_W, PLAT_H)) {
    const nearLeft = (h.x + h.w) - platX <= (platX + PLAT_W) - h.x;
    h.x = nearLeft ? platX - h.w : platX + PLAT_W;
  }
  h.x = clamp(h.x, 0, WORLD_W - h.w);

  // ---- vertical move + collision ----
  h.vy = clamp(h.vy + GRAVITY, -22, 22);
  const prevY = h.y;
  h.y += h.vy;
  h.onGround = false;
  h.onPlatform = false;
  h.onYellow = false;
  for (const b of solids) {
    if (b.off) continue;
    if (h.x >= b.x + b.size || h.x + h.w <= b.x) continue;
    if (h.y >= b.y + b.size || h.y + h.h <= b.y) continue;
    if (prevY + h.h <= b.y) {
      h.y = b.y - h.h;
      h.vy = 0;
      h.onGround = true;
      if (b.kind === YELLOW) h.onYellow = true;
    } else if (prevY >= b.y + b.size) {
      h.y = b.y + b.size;
      if (h.vy < 0) h.vy = 0;
    } else if ((h.y + h.h) - b.y <= (b.y + b.size) - h.y) {
      // Neither came-from held: a block (a lift, a shot mover) moved into us.
      // Shove out the nearer face.
      h.y = b.y - h.h;
      h.vy = 0;
      h.onGround = true;
      if (b.kind === YELLOW) h.onYellow = true;
    } else {
      h.y = b.y + b.size;
      if (h.vy < 0) h.vy = 0;
    }
  }
  if (l1 && harryHitsRect(platX, PLAT_Y, PLAT_W, PLAT_H)) {
    if (prevY + h.h <= PLAT_Y) {
      h.y = PLAT_Y - h.h;
      h.vy = 0;
      h.onGround = true;
      h.onPlatform = true;
    } else if (prevY >= PLAT_Y + PLAT_H) {
      h.y = PLAT_Y + PLAT_H;
      if (h.vy < 0) h.vy = 0;
    }
  }
  if (h.y + h.h >= WORLD_H) {
    h.y = WORLD_H - h.h;
    h.vy = 0;
    h.onGround = true;
  }
  if (h.y < 0) {
    h.y = 0;
    if (h.vy < 0) h.vy = 0;
  }

  if (!l1) return;                               // nothing else lives in the empty rooms

  // ---- the secret purple platform (cell 469) ----
  if (harryHitsRect(MAGIC_ON.x, MAGIC_ON.y, MAGIC_ON.w, MAGIC_ON.h)) {
    if (moved > 0) setMagicPlatform(true);
    else if (moved < 0) setMagicPlatform(false);
  }
  if (h.vy > 0 && harryHitsRect(MAGIC_OFF.x, MAGIC_OFF.y, MAGIC_OFF.w, MAGIC_OFF.h)) setMagicPlatform(false);

  // ---- the cell-203 portal ----
  if (harryHitsRect(cellX(PORTAL_CELL), cellY(PORTAL_CELL), CELL, CELL)) {
    h.warping = true;
    h.warpT = 0;
    audio.play(SFX_PORTAL);
  }

  // ---- coins and the shared lifebar ----
  for (const coin of coins) {
    if (coin.alive && harryHitsRect(coin.x, coin.y, COIN_SIZE, COIN_SIZE)) takeCoin(coin);
  }
  const inWater = h.x + h.w > WATER_X && h.x < WATER_X + WATER_W && h.y + h.h > WATER_Y;
  if (inWater) {
    hp -= DROWN_RATE;
    if (hp <= 0) {
      hp = 0;
      showDeath(DEATH_WATER);
    }
  }
  if (h.hitCooldown > 0) {
    h.hitCooldown -= STEP;
  } else if (harryHitsRect(enemyX, enemyY, ENEMY_SIZE, ENEMY_SIZE)) {
    audio.play(SFX_PUNCH);
    hp -= ENEMY_HIT;
    h.hitCooldown = ENEMY_GRACE;
    if (hp <= 0) {
      hp = 0;
      showDeath(DEATH_ENEMY);
    }
  }
}

// ---- the poses ----
// Each pose is a flat list of (column, row, part) triples: one 5px red-grid
// square each, tagged with the body part it belongs to so it is shaded its own
// colour. Columns run 0..3 for the upright forms (a swinging arm may poke out
// to -1 or 4) and 0..5 lying down; facing left mirrors them as pivot - col.
// Rows are measured from the top of the box.
const HEAD = 0, CHEST = 1, ARM = 2, LEG = 3, EYE = 4;

// Builds a pose from per-part lists of (col, row) pairs. The eye goes last so
// it is drawn over the head.
function makePose(head, chest, arm, leg, eye) {
  const cells = [];
  const add = (part, list) => { for (let i = 0; i < list.length; i += 2) cells.push(list[i], list[i + 1], part); };
  add(HEAD, head); add(CHEST, chest); add(ARM, arm); add(LEG, leg); add(EYE, eye);
  return cells;
}
const UPRIGHT_HEAD = [1, 0, 2, 0, 1, 1, 2, 1];
const LEANING_HEAD = [2, 0, 3, 0, 2, 1, 3, 1];
const RUN_CHEST = [1, 2, 2, 2, 1, 3, 2, 3, 2, 4];
const POSE_IDLE_0 = makePose(UPRIGHT_HEAD, [1, 2, 2, 2, 1, 3, 2, 3, 1, 4, 2, 4], [0, 2, 3, 2, 0, 3, 3, 3],
  [1, 5, 2, 5, 1, 6, 2, 6, 1, 7, 2, 7, 0, 8, 1, 8, 2, 8, 3, 8], [2, 1]);
const POSE_IDLE_1 = makePose(UPRIGHT_HEAD, [1, 2, 2, 2, 1, 3, 2, 3, 1, 4, 2, 4], [0, 3, 3, 3, 0, 4, 3, 4],   // arms a row lower: the breathing frame
  [1, 5, 2, 5, 1, 6, 2, 6, 1, 7, 2, 7, 0, 8, 1, 8, 2, 8, 3, 8], [2, 1]);
const POSE_RUN_A = makePose(LEANING_HEAD, RUN_CHEST, [3, 2, 4, 3, 0, 2, 0, 3],   // right leg and arm forward
  [2, 5, 3, 6, 3, 7, 3, 8, 1, 5, 1, 6, 0, 7, 0, 8], [3, 1]);
const POSE_RUN_B = makePose(LEANING_HEAD, RUN_CHEST, [0, 3, 3, 3],               // mid-stride, legs gathered
  [1, 5, 2, 5, 1, 6, 2, 6, 1, 7, 2, 7, 1, 8, 2, 8], [3, 1]);
const POSE_RUN_C = makePose(LEANING_HEAD, RUN_CHEST, [0, 2, -1, 3, 3, 2, 3, 3],  // left leg and arm forward
  [1, 5, 0, 6, 0, 7, 0, 8, 2, 5, 3, 6, 3, 7, 3, 8], [3, 1]);
const POSE_JUMP = makePose([1, 2, 2, 2, 1, 3, 2, 3], [1, 4, 2, 4, 1, 5, 2, 5], [0, 0, 3, 0, 1, 1, 2, 1],   // arms up, knees drawn up
  [0, 6, 1, 6, 2, 6, 3, 6, 0, 7, 3, 7, 0, 8, 3, 8], [2, 3]);
const POSE_CROUCH = makePose(UPRIGHT_HEAD, [1, 2, 2, 2], [0, 1, 3, 1, 0, 2, 3, 2],          // folded down into six rows
  [0, 3, 1, 3, 2, 3, 3, 3, 0, 4, 3, 4, 0, 5, 1, 5, 2, 5, 3, 5], [2, 1]);
const POSE_PRONE_0 = makePose([5, 0, 5, 1], [2, 0, 3, 0, 4, 0, 2, 1, 3, 1, 4, 1], [1, 1],   // flat, head to the right
  [0, 2, 1, 2, 2, 2, 3, 2, 4, 2], [5, 1]);
const POSE_PRONE_1 = makePose([5, 1], [2, 0, 3, 0, 4, 0, 5, 0, 2, 1, 3, 1, 4, 1], [0, 1, 1, 1],   // the crawl reach
  [0, 2, 1, 2, 2, 2, 4, 2, 5, 2], [5, 1]);
const RUN_CYCLE = [POSE_RUN_A, POSE_RUN_B, POSE_RUN_C, POSE_RUN_B];

// The pose for an animation at time t into the pose list, and its mirror
// pivot (the last column), into poseCells / posePivot.
let poseCells = POSE_IDLE_0, posePivot = 3;
function choosePose(anim, t) {
  posePivot = 3;
  if (anim === ANIM_IDLE) poseCells = Math.floor(t * 2) % 2 === 1 ? POSE_IDLE_1 : POSE_IDLE_0;
  else if (anim === ANIM_RUN) poseCells = RUN_CYCLE[Math.floor(t * 12) % 4];
  else if (anim === ANIM_JUMP) poseCells = POSE_JUMP;
  else if (anim === ANIM_CROUCH) poseCells = POSE_CROUCH;
  else {
    posePivot = 5;
    poseCells = anim === ANIM_PRONE_MOVE && Math.floor(t * 8) % 2 === 1 ? POSE_PRONE_1 : POSE_PRONE_0;
  }
}

// Each part keeps the level's shiny three-tone look in its own hue: skin head,
// green shirt, orange sleeves, blue trousers, a white eye with a blue glint.
const harryPieces = [
  makePieceSprite(FINE, 0xb5763a, 0xe8a86a, 0xffd9ad),   // HEAD
  makePieceSprite(FINE, 0x1a9e33, 0x4dff6a, 0xd6ffdf),   // CHEST
  makePieceSprite(FINE, 0x9e4a1a, 0xffa64d, 0xffe1c2),   // ARM
  makePieceSprite(FINE, 0x1a3f9e, 0x4d8bff, 0xcfe0ff),   // LEG
  makePieceSprite(FINE, 0x22303d, 0xffffff, 0x8fd0ff),   // EYE
];
const HARRY_FACE_COLORS = [0xe8a86a, 0x4dff6a, 0xffa64d, 0x4d8bff, 0xffffff];

// The portal swallow: every square of the current pose spirals in toward the
// centre of cell 203, spinning faster and shrinking as it goes, then winks out.
function drawHarryWarp() {
  const h = harry;
  if (h.warpT >= HARRY_WARP_DUR) return;           // gone; waiting on the respawn beat
  const k = clamp(h.warpT / HARRY_WARP_DUR, 0, 1);
  const ease = k * k;                              // accelerate into the hole
  const pull = 1 - ease;                           // the spread of the squares collapses to a point
  const portX = cellX(PORTAL_CELL) + CELL / 2, portY = cellY(PORTAL_CELL) + CELL / 2;
  const hcx = h.x + h.w / 2, hcy = h.y + h.h / 2;
  const angle = ease * HARRY_WARP_SPINS * 2 * Math.PI;
  const ca = Math.cos(angle), sa = Math.sin(angle);
  const size = Math.max(FINE * (1 - 0.85 * ease), 1.5);
  ctx.globalAlpha = clamp(1 - ease * ease, 0, 1);
  choosePose(h.anim, h.animT);
  for (let i = 0; i < poseCells.length; i += 3) {
    const col = h.faceDir > 0 ? poseCells[i] : posePivot - poseCells[i];
    const ox = h.x + col * FINE + FINE / 2 - hcx;
    const oy = h.y + poseCells[i + 1] * FINE + FINE / 2 - hcy;
    const rx = (ox * ca - oy * sa) * pull;
    const ry = (ox * sa + oy * ca) * pull;
    const bx = hcx + (portX - hcx) * ease + rx;
    const by = hcy + (portY - hcy) * ease + ry;
    ctx.fillStyle = hex(HARRY_FACE_COLORS[poseCells[i + 2]]);
    ctx.fillRect(bx - size / 2, by - size / 2, size, size);
  }
  ctx.globalAlpha = 1;
}

// One shiny square per grid cell of the pose, coloured by its body part.
function drawHarry() {
  const h = harry;
  if (h.warping) {
    drawHarryWarp();
    return;
  }
  // Idle breathes: the head, chest and arms lift a pixel on the inhale while
  // the legs stay planted.
  const bob = h.anim === ANIM_IDLE && Math.sin(h.animT * 2.2) > 0.3 ? -1 : 0;

  // The arm on the leading side sits at or past the pivot column; while
  // aiming, that pose-drawn arm is replaced by the swinging arm below, so it
  // is skipped here to avoid a third arm.
  choosePose(h.anim, h.animT);
  for (let i = 0; i < poseCells.length; i += 3) {
    const part = poseCells[i + 2];
    if (h.selected && part === ARM && poseCells[i] >= posePivot) continue;
    const col = h.faceDir > 0 ? poseCells[i] : posePivot - poseCells[i];
    const y = h.y + poseCells[i + 1] * FINE + (part === LEG ? 0 : bob);   // legs and feet never leave the ground
    drawPiece(harryPieces[part], h.x + col * FINE, y);
  }

  if (h.selected) {
    // The aiming arm: swings to point wherever the pointer is, and is where
    // bullets leave from.
    aimHarryAt(mouseX, mouseY);
    for (let k = 1; k <= HARRY_ARM_SEGS; k++) {
      drawPiece(harryPieces[ARM], shoulderX + aimX * k * FINE - FINE / 2, shoulderY + aimY * k * FINE - FINE / 2);
    }
    ctx.font = 'bold 10px ' + FONT_FAMILY;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'alphabetic';
    ctx.fillStyle = hex(0xffd6d6);
    ctx.globalAlpha = 0.9;
    ctx.fillText(ANIM_NAMES[h.anim], h.x + h.w / 2, h.y - 12);
    ctx.globalAlpha = 1;
  }
}

// Each bullet is one shiny square in Harry's sleeve orange, with a short
// streak back along its path so it reads as speed.
function drawHarryBullets() {
  ctx.fillStyle = hex(0xffa64d);
  for (const bullet of harry.bullets) {
    if (!bullet.alive) continue;
    for (let i = 1; i <= 3; i++) {
      ctx.globalAlpha = 0.28 * (1 - i / 4);
      ctx.fillRect(Math.round(bullet.x - bullet.vx * i * 0.5), Math.round(bullet.y - bullet.vy * i * 0.5), HARRY_BULLET_SIZE, HARRY_BULLET_SIZE);
    }
    ctx.globalAlpha = 1;
    drawPiece(harryPieces[ARM], bullet.x, bullet.y);
  }
}

// Level 1 back to its opening state: the player whole at the spawn, the
// platform and lift back where they start, the button, coins and tally
// restored, and the 311 platform earned again.
function resetLevel1() {
  dead = false;
  hp = MAX_HP;
  resetWhitesquare();
  resetHarry();
  platX = PLAT_MIN_X;
  platDir = 1;
  spawnButtons();
  spawnCoins();
  coinsTaken = 0;
  spawnEnemy();                        // back at its end of the shelf
  resetYellow();
  resetMovers();                       // anything shot into motion is back home and still
  setMagicPlatform(false);
  magicAnim = 0;
}
bakeLevel1();                          // needs the HUD constants above
resetLevel1();

// ---- Screens & UI (step 9) ----

const BACK_RECT = { x: 16, y: 12, w: 86, h: 28 };

// Is the pointer inside the box?
function hovered(x, y, w, h) {
  return mouseX >= x && mouseX < x + w && mouseY >= y && mouseY < y + h;
}

// ---- Text and panels ----
// Text is drawn from its baseline; drawTextTop from its top edge, which lets
// the modal's layout maths (a top-anchored y walked down line by line) carry over.
function drawTextCentered(text, cx, baselineY, size, color) {
  ctx.font = 'bold ' + size + 'px ' + FONT_FAMILY;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'alphabetic';
  ctx.fillStyle = color;
  ctx.fillText(text, cx, baselineY);
}

function drawTextTop(text, cx, topY, size, color) {
  drawTextCentered(text, cx, topY + size * 0.8, size, color);
}

// A rounded panel with a border, the shape every button in the CSS uses.
function drawPanel(x, y, w, h, radius, fill, border, thickness) {
  ctx.beginPath();
  ctx.roundRect(x, y, w, h, radius);
  ctx.fillStyle = fill;
  ctx.fill();
  ctx.strokeStyle = border;
  ctx.lineWidth = thickness;
  ctx.stroke();
}

const COLOR_TILE = hex(0x3d3d55), COLOR_TILE_HOT = hex(0x5a5a8c);
const COLOR_TILE_BORDER = hex(0x55557a), COLOR_TILE_BORDER_HOT = hex(0x8888c8);
const COLOR_TEXT = hex(0xcfcfe6);
const COLOR_LOCKED = hex(0x2f2f44), COLOR_LOCKED_BORDER = hex(0x3f3f5c), COLOR_LOCKED_TEXT = hex(0x6d6d8c);

// ---- Level locks ----
// Only level 1 is open at first. Collecting all four coins in one run of
// level 1, or pressing U on the level select, opens the rest. Deliberately
// not saved anywhere: quitting, refreshing or leaving the page and coming back
// locks everything again.
let levelsUnlocked = false;

function isLevelOpen(n) {
  return n === 1 || levelsUnlocked;
}

function unlockLevels() {
  if (levelsUnlocked) return;
  levelsUnlocked = true;
  showToast('All levels unlocked');
}

// A short notice at the top centre, fading in and out.
const TOAST_SECONDS = 3.5;
const TOAST_FADE = 0.3;
let toastText = '';
let toastStart = -Infinity;

function showToast(text) {
  toastText = text;
  toastStart = time;
}

function drawToast() {
  const age = time - toastStart;
  if (age < 0 || age > TOAST_SECONDS) return;
  ctx.globalAlpha = Math.min(1, age / TOAST_FADE, (TOAST_SECONDS - age) / TOAST_FADE);
  ctx.font = 'bold 14px ' + FONT_FAMILY;
  const w = ctx.measureText(toastText).width + 36;
  drawPanel((WORLD_W - w) / 2, 14, w, 30, 8, hex(0x2f8f4e), 'rgba(120,255,160,' + 115 / 255 + ')', 1);
  drawTextCentered(toastText, WORLD_W / 2, 34, 14, hex(0xeef0ff));
  ctx.globalAlpha = 1;
}

// A small padlock: a shackle over a body, centred on cx.
function drawPadlock(cx, top, color) {
  ctx.strokeStyle = color;
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.arc(cx, top + 6, 5, Math.PI, 2 * Math.PI);
  ctx.stroke();
  ctx.fillStyle = color;
  ctx.beginPath();
  ctx.roundRect(cx - 8, top + 6, 16, 12, 2);
  ctx.fill();
}

// ---- Level select (the first screen) ----
// A 5-wide grid of 90px tiles under a title.
const LEVEL_COUNT = 10;
const SELECT_CELL = 90, SELECT_GAP = 14, SELECT_COLS = 5;
const SELECT_ROWS = Math.ceil(LEVEL_COUNT / SELECT_COLS);
const TITLE_SIZE = 32;
const selectGridW = SELECT_COLS * SELECT_CELL + (SELECT_COLS - 1) * SELECT_GAP;
const selectGridH = SELECT_ROWS * SELECT_CELL + (SELECT_ROWS - 1) * SELECT_GAP;
const selectX0 = (WORLD_W - selectGridW) / 2;
const selectY0 = (WORLD_H - (TITLE_SIZE + 30 + selectGridH)) / 2 + TITLE_SIZE + 30;
const selectTiles = Array.from({ length: LEVEL_COUNT }, (_, i) => ({
  x: selectX0 + (i % SELECT_COLS) * (SELECT_CELL + SELECT_GAP),
  y: selectY0 + Math.floor(i / SELECT_COLS) * (SELECT_CELL + SELECT_GAP),
  w: SELECT_CELL, h: SELECT_CELL,
}));
// The way out: there is no title bar to close. In a browser it goes back a page.
const QUIT_RECT = { x: (WORLD_W - 120) / 2, y: selectTiles[LEVEL_COUNT - 1].y + SELECT_CELL + 28, w: 120, h: 34 };

function quitGame() {
  if (history.length > 1) history.back();
}

function drawSelectScreen() {
  drawTextCentered('SELECT LEVEL', WORLD_W / 2, selectTiles[0].y - 30 - TITLE_SIZE, TITLE_SIZE, hex(0xf0f0f0));
  for (let n = 1; n <= LEVEL_COUNT; n++) {
    const r = selectTiles[n - 1];
    if (!isLevelOpen(n)) {                             // locked: dimmed, padlocked, no hover lift
      drawPanel(r.x, r.y, r.w, r.h, 8, COLOR_LOCKED, COLOR_LOCKED_BORDER, 2);
      drawTextCentered(String(n), r.x + r.w / 2, r.y + (r.h - 24) / 2 + 20, 24, COLOR_LOCKED_TEXT);
      drawPadlock(r.x + r.w / 2, r.y + 58, COLOR_LOCKED_TEXT);
      continue;
    }
    const hot = hovered(r.x, r.y, r.w, r.h);
    const y = hot ? r.y - 3 : r.y;                     // the CSS lifts the tile on hover
    drawPanel(r.x, y, r.w, r.h, 8, hot ? COLOR_TILE_HOT : COLOR_TILE, hot ? COLOR_TILE_BORDER_HOT : COLOR_TILE_BORDER, 2);
    drawTextCentered(String(n), r.x + r.w / 2, y + (r.h - 24) / 2 + 20, 24, hot ? '#fff' : COLOR_TEXT);
  }
  if (!levelsUnlocked) {
    drawTextCentered('Collect all 4 coins in level 1 to unlock the rest', WORLD_W / 2, QUIT_RECT.y + QUIT_RECT.h + 34, 12, COLOR_LOCKED_TEXT);
    drawTextCentered('(or press U)', WORLD_W / 2, QUIT_RECT.y + QUIT_RECT.h + 52, 12, COLOR_LOCKED_TEXT);
  }
  const hotQuit = hovered(QUIT_RECT.x, QUIT_RECT.y, QUIT_RECT.w, QUIT_RECT.h);
  const quitY = hotQuit ? QUIT_RECT.y - 3 : QUIT_RECT.y;
  drawPanel(QUIT_RECT.x, quitY, QUIT_RECT.w, QUIT_RECT.h, 8, hotQuit ? hex(0x6b3d4f) : COLOR_TILE,
    hotQuit ? hex(0xc88a9e) : COLOR_TILE_BORDER, 2);
  drawTextCentered('Quit', QUIT_RECT.x + QUIT_RECT.w / 2, quitY + QUIT_RECT.h / 2 + 5, 15, hotQuit ? '#fff' : COLOR_TEXT);
}

function drawBackButton() {
  const hot = hovered(BACK_RECT.x, BACK_RECT.y, BACK_RECT.w, BACK_RECT.h) && !dead;   // the death card covers it
  drawPanel(BACK_RECT.x, BACK_RECT.y, BACK_RECT.w, BACK_RECT.h, 6, hot ? COLOR_TILE_HOT : COLOR_TILE, COLOR_TILE_BORDER, 2);
  drawTextCentered('< Levels', BACK_RECT.x + BACK_RECT.w / 2, BACK_RECT.y + BACK_RECT.h / 2 + 5, 14, hot ? '#fff' : COLOR_TEXT);
}

// The clicks the level itself didn't take: a tile or Quit on the picker, the
// Back button on a level. Run last in update() so a click that switches
// screens can't fall through to what now sits under the pointer.
function updateScreenButtons() {
  if (screen === SCREEN_SELECT) {
    for (let n = 1; n <= LEVEL_COUNT; n++) {
      const r = selectTiles[n - 1];
      if (!isLevelOpen(n)) continue;                   // a locked tile takes no clicks
      if (hovered(r.x, r.y, r.w, r.h) && consumeClick()) {
        if (n === 2) gotoLevel2();
        else if (n === 3) gotoLevel3();
        else if (n === 4) gotoLevel4();
        else openLevel(n);
      }
    }
    if (hovered(QUIT_RECT.x, QUIT_RECT.y, QUIT_RECT.w, QUIT_RECT.h) && consumeClick()) quitGame();
  } else if (hovered(BACK_RECT.x, BACK_RECT.y, BACK_RECT.w, BACK_RECT.h) && !dead && consumeClick()) {
    gotoLevelSelect();
  }
}

// Escape backs out of a level to the picker, and out of the picker to the page before.
function handleEscape() {
  if (screen === SCREEN_SELECT) quitGame();
  else gotoLevelSelect();
}

// ---- Screen switching ----
function openLevel(level) {
  currentLevel = level;
  resetLevel1();
  screen = SCREEN_LEVEL1;
}

function gotoLevel2() {
  currentLevel = 2;
  dead = false;
  screen = SCREEN_LEVEL2;
}

function gotoLevel3() {
  currentLevel = 3;
  dead = false;
  screen = SCREEN_LEVEL3;
  level3ShiftOn = false;
  buildLevel3Blocks();
  resetHarry();                        // after the screen switch: level 3 has its own spawn
}

function gotoLevel4() {
  currentLevel = 4;
  dead = false;
  screen = SCREEN_LEVEL4;
  resetHarry();                        // after the screen switch: level 4 has its own spawn
  resetLight();
}

function gotoLevelSelect() {
  dead = false;
  resetWhitesquare();                  // without this a drowned/spent state is still there on the way out
  resetHarry();                        // ...or a hazard death leaves Harry standing in it
  resetMovers();
  screen = SCREEN_SELECT;
}

// ---- Death card ----
// Laid out from the CSS box model: a 340px card with 28px padding, a heading,
// two lines of copy and a column of two buttons.
const MODAL_W = 340, MODAL_PAD_Y = 28, MODAL_TITLE = 26, MODAL_BODY = 14;
const MODAL_BTN_H = 40, MODAL_BTN_GAP = 12;
const MODAL_H = MODAL_PAD_Y + MODAL_TITLE + 8 + 2 * (MODAL_BODY + 3) + 22 + 2 * MODAL_BTN_H + MODAL_BTN_GAP + MODAL_PAD_Y;
const MODAL_FADE = 0.25;               // seconds, the dimming overlay
const MODAL_POP = 0.28;                // seconds, the card's pop-in
const MODAL_BOX = { x: (WORLD_W - MODAL_W) / 2, y: (WORLD_H - MODAL_H) / 2, w: MODAL_W, h: MODAL_H };
const MODAL_BTN_Y0 = MODAL_BOX.y + MODAL_PAD_Y + MODAL_TITLE + 8 + 2 * (MODAL_BODY + 3) + 22;
const modalButtons = [0, 1].map((i) => ({ x: MODAL_BOX.x + 26, y: MODAL_BTN_Y0 + i * (MODAL_BTN_H + MODAL_BTN_GAP), w: MODAL_W - 52, h: MODAL_BTN_H }));

// Colours here are [r, g, b, a(0..255)] so a fade can scale the alpha.
const MODAL_CARD_TOP = [0x2f, 0x33, 0x50, 255], MODAL_CARD_BOT = [0x1c, 0x1f, 0x33, 255], MODAL_CARD_BORDER = [150, 175, 255, 89];
const MODAL_RETRY = { top: [0x2f, 0x8f, 0x4e, 255], bot: [0x1f, 0x6d, 0x3a, 255], border: [120, 255, 160, 115] };
const MODAL_LEVELS = { top: [0x4a, 0x4f, 0x78, 255], bot: [0x36, 0x3a, 0x5c, 255], border: [150, 175, 255, 102] };

function cssColor(c, alphaScale) {
  return 'rgba(' + c[0] + ',' + c[1] + ',' + c[2] + ',' + (c[3] / 255) * alphaScale + ')';
}

function lerpColor(a, b, t) {
  return [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t, a[2] + (b[2] - a[2]) * t, a[3] + (b[3] - a[3]) * t];
}

// A glow that never pulses, baked once: { frame, pad }.
function bakeStaticGlow(w, h, radius, rgb, spread, strength) {
  const style = makeGlowStyle([{ rgb, spread, spreadRange: 0, alpha: strength, alphaRange: 0 }]);
  return { frame: bakeGlowFrame(style, w, h, radius, 0), pad: style.pad };
}
const modalGlow = bakeStaticGlow(MODAL_W, MODAL_H, 14, [120, 150, 255], 20, 0.20);
const retryGlow = bakeStaticGlow(modalButtons[0].w, MODAL_BTN_H, 8, MODAL_RETRY.border, 12, 0.35 * MODAL_RETRY.border[3] / 255);
const levelsGlow = bakeStaticGlow(modalButtons[1].w, MODAL_BTN_H, 8, MODAL_LEVELS.border, 12, 0.35 * MODAL_LEVELS.border[3] / 255);

// A rounded panel with a vertical gradient: the caps are filled with the
// midpoint colour and the straight band between them carries the blend, which
// hides the seam at a small radius.
function drawGradPanel(x, y, w, h, radius, top, bot, border, alpha) {
  ctx.beginPath();
  ctx.roundRect(x, y, w, h, radius);
  ctx.fillStyle = cssColor(lerpColor(top, bot, 0.5), alpha);
  ctx.fill();
  if (h > 2 * radius) {
    const gradient = ctx.createLinearGradient(0, y + radius, 0, y + h - radius);
    gradient.addColorStop(0, cssColor(lerpColor(top, bot, radius / h), alpha));
    gradient.addColorStop(1, cssColor(lerpColor(top, bot, 1 - radius / h), alpha));
    ctx.fillStyle = gradient;
    ctx.fillRect(x, y + radius, w, h - 2 * radius);
  }
  ctx.beginPath();
  ctx.roundRect(x, y, w, h, radius);
  ctx.strokeStyle = cssColor(border, alpha);
  ctx.lineWidth = 1;
  ctx.stroke();
}

// The CSS pop used a cubic-bezier that overshoots; this is the usual back-out easing.
function easeBackOut(t) {
  const c1 = 1.70158, c3 = c1 + 1, u = t - 1;
  return 1 + c3 * u * u * u + c1 * u * u;
}

// The <kbd> chip beside a button label; returns its width.
function drawKbd(label, x, cy, alpha) {
  ctx.font = 'bold 12px ' + FONT_FAMILY;
  const w = ctx.measureText(label).width + 16;
  ctx.beginPath();
  ctx.roundRect(x, cy - 9, w, 18, 5);
  ctx.fillStyle = cssColor([0, 0, 0, 89], alpha);
  ctx.fill();
  ctx.strokeStyle = cssColor([255, 255, 255, 64], alpha);
  ctx.lineWidth = 1;
  ctx.stroke();
  ctx.textAlign = 'left';
  ctx.textBaseline = 'alphabetic';
  ctx.fillStyle = cssColor([0xdf, 0xe4, 0xff, 255], alpha);
  ctx.fillText(label, x + 8, cy + 4);
  return w;
}

const WHITE = [255, 255, 255, 255];
function drawModalButton(i, label, key, colors, glow, alpha) {
  const r = modalButtons[i];
  let y = r.y, top = colors.top, bot = colors.bot;
  if (hovered(r.x, r.y, r.w, r.h) && alpha > 0.9) {
    y -= 2;                                            // the CSS lifts it
    top = lerpColor(top, WHITE, 0.12);
    bot = lerpColor(bot, WHITE, 0.12);
    ctx.drawImage(glow.frame, r.x - glow.pad, y - glow.pad);
  }
  drawGradPanel(r.x, y, r.w, r.h, 8, top, bot, colors.border, alpha);

  // label and key cap sit side by side, centred together
  ctx.font = 'bold 15px ' + FONT_FAMILY;
  const labelW = ctx.measureText(label).width;
  ctx.font = 'bold 12px ' + FONT_FAMILY;
  const keyW = ctx.measureText(key).width;
  const x = r.x + (r.w - (labelW + 10 + keyW + 16)) / 2, cy = y + r.h / 2;
  ctx.font = 'bold 15px ' + FONT_FAMILY;
  ctx.textAlign = 'left';
  ctx.textBaseline = 'alphabetic';
  ctx.fillStyle = cssColor([0xee, 0xf0, 0xff, 255], alpha);
  ctx.fillText(label, x, cy + 5);
  drawKbd(key, x + labelW + 10, cy, alpha);
}

// Enter retries, Escape bails out to the picker (handled globally); clicking
// the buttons does the same.
function handleDeathInput() {
  if (!dead) return;
  deathT += STEP;
  if (pressed.enter) {
    retry();
    return;
  }
  if (clicked) {
    const retryBtn = modalButtons[0], levelsBtn = modalButtons[1];
    if (hovered(retryBtn.x, retryBtn.y, retryBtn.w, retryBtn.h) && consumeClick()) retry();
    else if (hovered(levelsBtn.x, levelsBtn.y, levelsBtn.w, levelsBtn.h) && consumeClick()) gotoLevelSelect();
  }
}

function drawDeathModal() {
  if (!dead) return;
  const fadeT = clamp(deathT / MODAL_FADE, 0, 1);
  const pop = clamp(deathT / MODAL_POP, 0, 1);
  const alpha = clamp(deathT / 0.12, 0, 1);            // the text catches up quickly

  ctx.globalAlpha = fadeT;
  ctx.fillStyle = 'rgba(10,10,20,' + 140 / 255 + ')';
  ctx.fillRect(0, 0, WORLD_W, WORLD_H);
  ctx.globalAlpha = 1;

  // scale the card about its centre as it appears
  const scale = 0.8 + 0.2 * easeBackOut(pop);
  const cw = MODAL_BOX.w * scale, ch = MODAL_BOX.h * scale;
  const cx0 = MODAL_BOX.x + (MODAL_BOX.w - cw) / 2, cy0 = MODAL_BOX.y + (MODAL_BOX.h - ch) / 2;
  ctx.globalAlpha = alpha;
  ctx.drawImage(modalGlow.frame, cx0 - modalGlow.pad * scale, cy0 - modalGlow.pad * scale,
    modalGlow.frame.width * scale, modalGlow.frame.height * scale);
  ctx.globalAlpha = 1;
  drawGradPanel(cx0, cy0, cw, ch, 14, MODAL_CARD_TOP, MODAL_CARD_BOT, MODAL_CARD_BORDER, alpha);

  const lines = DEATH_COPY[deathBy];
  const cx = MODAL_BOX.x + MODAL_BOX.w / 2;
  let y = MODAL_BOX.y + MODAL_PAD_Y;
  drawTextTop(lines[0], cx, y, MODAL_TITLE, cssColor([0xff, 0x8a, 0x8a, 255], alpha));
  y += MODAL_TITLE + 8;
  drawTextTop(lines[1], cx, y, MODAL_BODY, cssColor([0xb7, 0xbc, 0xda, 255], alpha));
  y += MODAL_BODY + 3;
  drawTextTop(lines[2], cx, y, MODAL_BODY, cssColor([0xb7, 0xbc, 0xda, 255], alpha));

  drawModalButton(0, 'Retry', 'Enter', MODAL_RETRY, retryGlow, alpha);
  drawModalButton(1, 'Level Select', 'Esc', MODAL_LEVELS, levelsGlow, alpha);
}

// ---- Level 2: a spinning wheel of marker blocks ----
// Nothing in it but the border platforms boxing it in, and eight marker
// blocks plus a white centre in a 3x3 that D steps forward through a fixed
// schedule and A steps back through.
const level2Blocks = [];
for (let c = 1; c <= COLS; c++) level2Blocks.push(makeBlock(cellX(c), cellY(c), CELL, BLUE, MOVER_NONE));                 // top row
for (let r = 0; r < ROWS; r++) level2Blocks.push(makeBlock(0, r * CELL, CELL, BLUE, MOVER_NONE));                          // left column
for (let r = 0; r < ROWS; r++) level2Blocks.push(makeBlock((COLS - 1) * CELL, r * CELL, CELL, BLUE, MOVER_NONE));          // right column
for (let c = (ROWS - 1) * COLS + 1; c <= ROWS * COLS; c++) level2Blocks.push(makeBlock(cellX(c), cellY(c), CELL, BLUE, MOVER_NONE));   // bottom row
const level2Layer = makeLayer(WORLD_W, WORLD_H);
(function bakeLevel2() {
  const g = level2Layer.getContext('2d');
  g.drawImage(gridLayer, 0, 0);
  for (const b of level2Blocks) g.drawImage(blockSprites[b.kind], b.x, b.y);
})();

const LEVEL2_BASE_COL = [5, 6, 7, 5, 6, 7, 5, 7];
const LEVEL2_BASE_ROW = [26, 26, 26, 28, 28, 28, 27, 27];
const LEVEL2_KINDS = [GREEN, ORANGE, CYAN, YELLOW, MAGIC, RED, BLUE, MOVING];
const LEVEL2_WHITE_COL = 6, LEVEL2_WHITE_ROW = 27;
const LEVEL2_LABEL_SIZE = 12;
const LEVEL2_EASE_RATE = 14;           // per second: the drawn position chases the target, so rapid presses compound into one fluid slide
// One step of the forward sequence: [which block moves (an index into
// LEVEL2_KINDS, or -1 for the white centre), column, row].
const LEVEL2_SCHEDULE = [
  [2, 8, 26], [1, 7, 26], [2, 8, 27], [0, 6, 26], [2, 8, 28], [1, 8, 26], [6, 5, 26], [0, 7, 26],
  [3, 5, 27], [1, 8, 27], [6, 6, 26], [4, 5, 28], [5, 6, 28], [7, 7, 28], [-1, 7, 27],
  [0, 8, 26], [6, 7, 26], [3, 5, 26], [4, 5, 27], [3, 6, 26], [4, 6, 27],
  // second loop
  [0, 9, 26], [6, 8, 26], [0, 9, 27], [3, 7, 26], [4, 6, 26], [6, 9, 26], [3, 8, 26], [0, 9, 28], [5, 6, 27],
];
const level2Col = new Array(8), level2Row = new Array(8);            // where each marker stands
const level2DispCol = new Array(8), level2DispRow = new Array(8);    // what is drawn, easing toward that
let level2WhiteCol = LEVEL2_WHITE_COL, level2WhiteRow = LEVEL2_WHITE_ROW;
let level2WhiteDispCol = LEVEL2_WHITE_COL, level2WhiteDispRow = LEVEL2_WHITE_ROW;
let level2Steps = 0;                   // how many D presses so far — walks the schedule
for (let i = 0; i < 8; i++) {
  level2Col[i] = level2DispCol[i] = LEVEL2_BASE_COL[i];
  level2Row[i] = level2DispRow[i] = LEVEL2_BASE_ROW[i];
}

function level2SetPos(idx, col, row) {
  if (idx === -1) { level2WhiteCol = col; level2WhiteRow = row; }
  else { level2Col[idx] = col; level2Row[idx] = row; }
}

// Where block `idx` stood right before schedule step `before` ran: its target
// as of the last earlier step that moved it, or its starting cell if this is
// the first step that ever does. Into prevCol / prevRow.
let prevCol = 0, prevRow = 0;
function level2PrevPos(before, idx) {
  for (let j = before - 1; j >= 0; j--) {
    if (LEVEL2_SCHEDULE[j][0] === idx) { prevCol = LEVEL2_SCHEDULE[j][1]; prevRow = LEVEL2_SCHEDULE[j][2]; return; }
  }
  if (idx === -1) { prevCol = LEVEL2_WHITE_COL; prevRow = LEVEL2_WHITE_ROW; }
  else { prevCol = LEVEL2_BASE_COL[idx]; prevRow = LEVEL2_BASE_ROW[idx]; }
}

// D steps forward through the schedule; A steps back through the exact same
// list, undoing whichever move D last applied.
function updateLevel2() {
  if (screen !== SCREEN_LEVEL2) return;
  if (pressed.d && level2Steps < LEVEL2_SCHEDULE.length) {
    const m = LEVEL2_SCHEDULE[level2Steps];
    level2SetPos(m[0], m[1], m[2]);
    level2Steps++;
  }
  if (pressed.a && level2Steps > 0) {
    level2Steps--;
    const m = LEVEL2_SCHEDULE[level2Steps];
    level2PrevPos(level2Steps, m[0]);
    level2SetPos(m[0], prevCol, prevRow);
  }
  const t = clamp(STEP * LEVEL2_EASE_RATE, 0, 1);
  for (let i = 0; i < 8; i++) {
    level2DispCol[i] += (level2Col[i] - level2DispCol[i]) * t;
    level2DispRow[i] += (level2Row[i] - level2DispRow[i]) * t;
  }
  level2WhiteDispCol += (level2WhiteCol - level2WhiteDispCol) * t;
  level2WhiteDispRow += (level2WhiteRow - level2WhiteDispRow) * t;
}

// A shiny bevelled number in the middle of a square: a bright fleck a pixel
// low, then solid black on top, so it reads on any colour.
function drawLevel2Label(x, y, size, label) {
  const cy = y + (size - LEVEL2_LABEL_SIZE) / 2;
  drawTextTop(String(label), x + size / 2, cy + 1, LEVEL2_LABEL_SIZE, 'rgba(255,255,255,' + 160 / 255 + ')');
  drawTextTop(String(label), x + size / 2, cy, LEVEL2_LABEL_SIZE, '#000');
}

// Same look, white-on-black so it reads on the dark BLACK block too.
function drawLevel3Label(x, y, label) {
  const cy = y + (CELL - LEVEL2_LABEL_SIZE) / 2;
  drawTextTop(String(label), x + CELL / 2, cy + 1, LEVEL2_LABEL_SIZE, '#000');
  drawTextTop(String(label), x + CELL / 2, cy, LEVEL2_LABEL_SIZE, '#fff');
}

// The fixed centre of the wheel: a soft pulsing glow behind the player's own
// shiny piece, and a second glint in the opposite corner.
const glowLevel2White = makeGlowStyle([{ rgb: GLOW_WHITE, spread: 8, spreadRange: 0, alpha: 0.3, alphaRange: 0.25 }]);
const whiteBlockSprite = makePieceSprite(CELL, PIECE_WHITE.edge, PIECE_WHITE.face, PIECE_WHITE.hi);
function drawLevel2White(x, y) {
  const p = pulse();
  drawGlow(glowLevel2White, x, y, CELL, CELL, 3, p);
  ctx.drawImage(whiteBlockSprite, Math.round(x), Math.round(y));
  const glint = CELL * 0.35;
  ctx.globalAlpha = 0.55 + 0.35 * p;
  ctx.fillStyle = '#fff';
  ctx.fillRect(Math.round(x + CELL - glint), Math.round(y + CELL - glint), Math.round(glint), Math.round(glint));
  ctx.globalAlpha = 1;
  drawLevel2Label(x, y, CELL, 0);
}

function drawLevel2Screen() {
  ctx.drawImage(level2Layer, 0, 0);
  for (let i = 0; i < 8; i++) {
    const x = level2DispCol[i] * CELL, y = level2DispRow[i] * CELL;
    drawBlock(LEVEL2_KINDS[i], x, y);
    drawLevel2Label(x, y, CELL, i + 1);
  }
  drawLevel2White(level2WhiteDispCol * CELL, level2WhiteDispRow * CELL);
  if (debug.fine) ctx.drawImage(fineGridLayer, 0, 0);
  drawHoverHighlight();
  drawBackButton();
}

// ---- Level 3: a bare border room, Harry, and two shot-moved blocks ----
const level3Blocks = [];
let level3ShiftOn = false;
const LEVEL3_SHIFT_RATE = 10;          // per second, the eased approach to home or target
const level3Layer = makeLayer(WORLD_W, WORLD_H);

function addLevel3(cell, kind) {
  const b = makeBlock(cellX(cell), cellY(cell), CELL, kind, MOVER_NONE);
  level3Blocks.push(b);
  return b;
}

// A block that shooting flips between its home cell and `targetCell`.
function addLevel3Shifter(cell, kind, targetCell) {
  const b = addLevel3(cell, kind);
  b.mover = MOVER_SHIFT;
  b.targetX = cellX(targetCell);
  b.targetY = cellY(targetCell);
}

// Blue blocks boxing in an empty room: top and bottom rows, left and right
// columns. `add(cell, kind)` puts one block in whichever level is building.
function addRoomBorder(add) {
  for (let c = 1; c <= COLS; c++) add(c, BLUE);                               // top row
  for (let r = 1; r < ROWS - 1; r++) add(r * COLS + 1, BLUE);                 // left column
  for (let r = 1; r < ROWS - 1; r++) add(r * COLS + COLS, BLUE);              // right column
  for (let c = (ROWS - 1) * COLS + 1; c <= ROWS * COLS; c++) add(c, BLUE);    // bottom row
}

function buildLevel3Blocks() {
  level3Blocks.length = 0;
  addRoomBorder(addLevel3);
  for (const cell of [973, 1133, 1013, 1053, 1093, 1138, 887, 1087]) addLevel3(cell, BLUE);
  addLevel3Shifter(658, YELLOW, 657);  // label "1" -> shot moves it to 657
  addLevel3Shifter(985, BLACK, 986);   // label "2" -> shot moves it to 986

  // everything that never moves is baked with the grid
  const g = level3Layer.getContext('2d');
  g.clearRect(0, 0, WORLD_W, WORLD_H);
  g.drawImage(gridLayer, 0, 0);
  for (const b of level3Blocks) if (b.mover === MOVER_NONE) g.drawImage(blockSprites[b.kind], b.x, b.y);
}

// One shared switch, not one per block: shooting either flips it, and both
// ease towards their own target together, closing a fraction of the remaining
// distance each frame.
function updateLevel3Movers() {
  const t = clamp(STEP * LEVEL3_SHIFT_RATE, 0, 1);
  for (const b of level3Blocks) {
    if (b.mover !== MOVER_SHIFT) continue;
    b.x += ((level3ShiftOn ? b.targetX : b.homeX) - b.x) * t;
    b.y += ((level3ShiftOn ? b.targetY : b.homeY) - b.y) * t;
  }
}

function drawLevel3Screen() {
  ctx.drawImage(level3Layer, 0, 0);
  for (const b of level3Blocks) {
    if (b.mover === MOVER_NONE) continue;
    drawBlock(b.kind, b.x, b.y);
    drawLevel3Label(b.x, b.y, b.kind === YELLOW ? 1 : 2);   // the two shot-moved blocks carry their number with them
  }
  drawHarry();
  drawHarryBullets();
  if (debug.fine) ctx.drawImage(fineGridLayer, 0, 0);
  drawHoverHighlight();
  drawBackButton();
}

// ---- Level 4: the dark room ----
// Harry in a border room with ledges to climb, lit by a pool of light that
// follows him. Everything outside it sits under the Eyesz fog: a soft dark
// veil with a clear hole in the middle. Like Eyesz, the veil is painted ONCE
// and only its position changes as the player moves; its centre glides after
// Harry instead of snapping. Pairs of eyes drift about in the dark and vanish
// as the light reaches them.
const level4Blocks = [];
const level4Layer = makeLayer(WORLD_W, WORLD_H);

function addLevel4(cell, kind) {
  level4Blocks.push(makeBlock(cellX(cell), cellY(cell), CELL, kind, MOVER_NONE));
}

// A ledge of blue blocks along `row`, from column `from` to `to` inclusive.
function addLedge(row, from, to) {
  for (let col = from; col <= to; col++) addLevel4(row * COLS + col + 1, BLUE);
}

// Ledges zig-zag up the room. Harry's hop rises about 100px, so each ledge is
// 4 rows (80px) above the last and the gap between neighbours is 2 cells or less.
function buildLevel4Blocks() {
  level4Blocks.length = 0;
  addRoomBorder(addLevel4);
  addLedge(25, 4, 13);
  addLedge(21, 16, 25);
  addLedge(17, 28, 37);
  addLedge(13, 17, 26);
  addLedge(9, 5, 14);
  addLedge(5, 17, 26);
  addLedge(27, 27, 31);                // a low step and a short ledge on the right, off the main climb
  addLedge(23, 33, 37);

  const g = level4Layer.getContext('2d');
  g.clearRect(0, 0, WORLD_W, WORLD_H);
  g.drawImage(gridLayer, 0, 0);        // the grid is left as it is
  for (const b of level4Blocks) g.drawImage(blockSprites[b.kind], b.x, b.y);
}
buildLevel4Blocks();

// ---- The fog veil and the light ----
const FOG_CLEAR_RADIUS = 60;           // px, fully lit around Harry
const FOG_DARK_RADIUS = 170;           // px, fully dark beyond this
const FOG_DARKNESS = 0.94;             // the far alpha: nearly black, never quite
const VEIL_SIZE = 2 * WORLD_W;         // big enough to blanket the room wherever Harry stands
const veilSprite = makeLayer(VEIL_SIZE, VEIL_SIZE);
(function bakeVeil() {
  const g = veilSprite.getContext('2d');
  const c = VEIL_SIZE / 2;
  const gradient = g.createRadialGradient(c, c, FOG_CLEAR_RADIUS, c, c, FOG_DARK_RADIUS);
  gradient.addColorStop(0, 'rgba(0,0,0,0)');
  gradient.addColorStop(1, 'rgba(0,0,0,' + FOG_DARKNESS + ')');
  g.fillStyle = gradient;
  g.fillRect(0, 0, VEIL_SIZE, VEIL_SIZE);
})();

// A faint warm glow added over the lit area, baked once like the veil.
const LIGHT_RADIUS = FOG_DARK_RADIUS;
const lightSprite = makeLayer(2 * LIGHT_RADIUS, 2 * LIGHT_RADIUS);
(function bakeLight() {
  const g = lightSprite.getContext('2d');
  const gradient = g.createRadialGradient(LIGHT_RADIUS, LIGHT_RADIUS, 0, LIGHT_RADIUS, LIGHT_RADIUS, LIGHT_RADIUS);
  gradient.addColorStop(0, 'rgba(255,225,170,0.16)');
  gradient.addColorStop(1, 'rgba(255,225,170,0)');
  g.fillStyle = gradient;
  g.fillRect(0, 0, 2 * LIGHT_RADIUS, 2 * LIGHT_RADIUS);
})();

// The light's centre glides onto Harry (Eyesz eased the fog with a 0.4 s CSS
// transition): each frame it closes a fraction of the gap.
const LIGHT_FOLLOW = 0.12;
let lightX = 0, lightY = 0;

function resetLight() {
  lightX = harry.x + harry.w / 2;
  lightY = harry.y + harry.h / 2;
}

// ---- Eyes in the dark ----
// Eyesz's eyes: a pale disc with a dark pupil that looks toward the player
// (there toward the cursor, here toward Harry), capped at the eye's edge.
// Pairs wander the room; they only show in the shadow and fade as the light
// nears. One pair keeps the dark-red pupils of Eyesz's target eye.
const EYE_RADIUS = 7;
const EYE_GAP = 5;                     // between the two eyes of a pair
const EYE_PUPIL_RADIUS = 3;
const EYE_PUPIL_REACH = 3.5;           // furthest a pupil travels from the eye centre
const EYE_FADE = 60;                   // px over which an eye appears beyond the clear radius
const EYE_PAIRS = 9;
const EYE_BLINK_SECONDS = 0.16;

function makeDiscSprite(size, radius, fill, stroke) {
  const sprite = makeLayer(size, size);
  const g = sprite.getContext('2d');
  g.beginPath();
  g.arc(size / 2, size / 2, radius, 0, 2 * Math.PI);
  g.fillStyle = fill;
  g.fill();
  if (stroke) {
    g.strokeStyle = stroke;
    g.lineWidth = 1;
    g.stroke();
  }
  return sprite;
}
const eyeSprite = makeDiscSprite(2 * EYE_RADIUS + 2, EYE_RADIUS, '#e8e8ea', '#232328');
const pupilSprite = makeDiscSprite(2 * EYE_PUPIL_RADIUS + 2, EYE_PUPIL_RADIUS, '#111113');
const redPupilSprite = makeDiscSprite(2 * EYE_PUPIL_RADIUS + 2, EYE_PUPIL_RADIUS, '#7a0e0e');

// A small seeded generator so the eyes wander the same way every visit.
function makeRandom(seed) {
  let a = seed;
  return () => {
    a = (a + 0x6d2b79f5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
const eyeRandom = makeRandom(4);
const eyePairs = [];
const EYE_MIN_X = 40, EYE_MAX_X = WORLD_W - 40, EYE_MIN_Y = 40, EYE_MAX_Y = WORLD_H - 40;

function pickEyeTarget(pair) {
  pair.targetX = EYE_MIN_X + eyeRandom() * (EYE_MAX_X - EYE_MIN_X);
  pair.targetY = EYE_MIN_Y + eyeRandom() * (EYE_MAX_Y - EYE_MIN_Y);
}

function resetEyes() {
  eyePairs.length = 0;
  for (let i = 0; i < EYE_PAIRS; i++) {
    const pair = {
      x: EYE_MIN_X + eyeRandom() * (EYE_MAX_X - EYE_MIN_X),
      y: EYE_MIN_Y + eyeRandom() * (EYE_MAX_Y - EYE_MIN_Y),
      vx: 0, vy: 0, targetX: 0, targetY: 0,
      speed: 0.3 + eyeRandom() * 0.5,  // px per frame
      blinkT: 0, nextBlink: 1 + eyeRandom() * 4,
      red: i === 0,
    };
    pickEyeTarget(pair);
    eyePairs.push(pair);
  }
  eyePairs[0].speed = 0.25;            // the dark-red pair drifts slowest
}
resetEyes();

function updateEyes() {
  for (const pair of eyePairs) {
    const dx = pair.targetX - pair.x, dy = pair.targetY - pair.y;
    const dist = Math.hypot(dx, dy);
    if (dist < 6) pickEyeTarget(pair);
    else {                             // glide toward the target rather than snapping to a heading
      pair.vx += (dx / dist * pair.speed - pair.vx) * 0.03;
      pair.vy += (dy / dist * pair.speed - pair.vy) * 0.03;
    }
    pair.x += pair.vx;
    pair.y += pair.vy;
    pair.blinkT += STEP;
    if (pair.blinkT > pair.nextBlink + EYE_BLINK_SECONDS) {
      pair.blinkT = 0;
      pair.nextBlink = 2 + eyeRandom() * 4;
    }
  }
}

// One eye, squashed by `blink` (1 open, 0 shut), its pupil looking at Harry.
function drawEye(cx, cy, blink, pupil) {
  ctx.drawImage(eyeSprite, cx - eyeSprite.width / 2, cy - eyeSprite.height / 2 * blink, eyeSprite.width, eyeSprite.height * blink);
  if (blink < 0.3) return;
  const tx = harry.x + harry.w / 2 - cx, ty = harry.y + harry.h / 2 - cy;
  const d = Math.hypot(tx, ty) || 1;
  const reach = Math.min(EYE_PUPIL_REACH, d);
  ctx.drawImage(pupil, cx + tx / d * reach - pupil.width / 2, cy + ty / d * reach - pupil.height / 2 * blink, pupil.width, pupil.height * blink);
}

// Eyes show in the shadow only: invisible inside the clear light, fully there
// EYE_FADE px beyond it.
function drawEyes() {
  for (const pair of eyePairs) {
    const fromLight = Math.hypot(pair.x - lightX, pair.y - lightY);
    const alpha = clamp((fromLight - FOG_CLEAR_RADIUS) / EYE_FADE, 0, 1);
    if (alpha < 0.02) continue;
    const phase = pair.blinkT - pair.nextBlink;
    const blink = phase < 0 ? 1 : Math.abs(Math.cos(Math.PI * phase / EYE_BLINK_SECONDS));
    const pupil = pair.red ? redPupilSprite : pupilSprite;
    ctx.globalAlpha = alpha;
    drawEye(pair.x - EYE_RADIUS - EYE_GAP / 2, pair.y, blink, pupil);
    drawEye(pair.x + EYE_RADIUS + EYE_GAP / 2, pair.y, blink, pupil);
  }
  ctx.globalAlpha = 1;
}

function updateLevel4() {
  lightX += (harry.x + harry.w / 2 - lightX) * LIGHT_FOLLOW;
  lightY += (harry.y + harry.h / 2 - lightY) * LIGHT_FOLLOW;
  updateEyes();
}

function drawLevel4Screen() {
  ctx.drawImage(level4Layer, 0, 0);
  drawHarry();
  drawHarryBullets();
  // warm the lit area, then lay the veil over everything but the HUD
  ctx.globalCompositeOperation = 'lighter';
  ctx.drawImage(lightSprite, lightX - LIGHT_RADIUS, lightY - LIGHT_RADIUS);
  ctx.globalCompositeOperation = 'source-over';
  ctx.drawImage(veilSprite, lightX - VEIL_SIZE / 2, lightY - VEIL_SIZE / 2);
  drawEyes();
  if (debug.fine) ctx.drawImage(fineGridLayer, 0, 0);
  drawHoverHighlight();
  drawBackButton();
}

// ---- Input ----
// Raw physical key state, tracked regardless of who is selected (Harry reads
// it directly; the white square's gated copy is derived from it in step 3).
const raw = { left: false, right: false, jump: false, shoot: false, down: false, prone: false };
// Edge-triggered presses latched by the key listener and drained once per
// update() into the *Pressed flags, the same shape as Game.java's pending*.
const pending = { tab: false, enter: false, a: false, d: false, click: false };
const pressed = { tab: false, enter: false, a: false, d: false, click: false };
const debug = { fps: false, fine: false, hover: false };
let muted = false;

// Maps a key code to the raw movement flag it drives, or undefined.
const RAW_KEYS = {
  KeyA: 'left', ArrowLeft: 'left',
  KeyD: 'right', ArrowRight: 'right',
  KeyW: 'jump', ArrowUp: 'jump', Space: 'jump',
  Enter: 'shoot',
  KeyS: 'down', ArrowDown: 'down',
  ControlLeft: 'prone', ControlRight: 'prone', KeyC: 'prone',
};
// Keys the page must not act on itself (scrolling, focus traversal).
const SWALLOWED_KEYS = new Set(['Space', 'Tab', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight']);

addEventListener('keydown', (e) => {
  audio.unlock();
  const flag = RAW_KEYS[e.code];
  if (flag) raw[flag] = true;
  // Edge-latched presses fire on key repeat too, like AWT's keyPressed.
  if (e.code === 'KeyA' || e.code === 'ArrowLeft') pending.a = true;
  if (e.code === 'KeyD' || e.code === 'ArrowRight') pending.d = true;
  if (e.code === 'Enter') pending.enter = true;
  if (e.code === 'Tab') pending.tab = true;
  // Toggles only flip on the initial press.
  if (!e.repeat) {
    if (e.code === 'Escape') handleEscape();
    if (e.code === 'KeyJ') toggleFullscreen();
    if (e.code === 'KeyU' && screen === SCREEN_SELECT) unlockLevels();
    if (e.code === 'KeyM') { muted = !muted; audio.setMuted(muted); }
    if (e.code === 'Digit1') debug.fine = !debug.fine;
    if (e.code === 'KeyH') debug.hover = !debug.hover;
    if (e.code === 'KeyF') { debug.fps = !debug.fps; resetFpsWindow(); }
  }
  if (SWALLOWED_KEYS.has(e.code)) e.preventDefault();
});

addEventListener('keyup', (e) => {
  const flag = RAW_KEYS[e.code];
  if (flag) raw[flag] = false;
});

// A key released while the tab was unfocused never reports keyup; clear
// everything so the square doesn't keep running.
addEventListener('blur', () => { for (const k in raw) raw[k] = false; });

// Mouse position in world space (the CSS scale undone), plus a click latch.
let mouseX = 0;
let mouseY = 0;
addEventListener('mousemove', (e) => {
  const rect = canvas.getBoundingClientRect();
  mouseX = (e.clientX - rect.left) * WORLD_W / rect.width;
  mouseY = (e.clientY - rect.top) * WORLD_H / rect.height;
});
canvas.addEventListener('mousedown', (e) => {
  audio.unlock();
  if (e.button === 0) pending.click = true;
  canvas.focus();
});

// ---- Scaling & fullscreen ----
// Largest whole multiple of 800x600 that fits the window; if the window is
// smaller than one world, shrink to fit instead.
//
// The page around the canvas carries on the base 20px grid outward from the
// level's own cell edges (what Java drew in its borderless fullscreen window),
// so the lattice stays in step with the level however big the window is.
function fitCanvas() {
  let k = Math.min(innerWidth / WORLD_W, innerHeight / WORLD_H);
  if (k >= 1) k = Math.floor(k);
  canvas.style.width = WORLD_W * k + 'px';
  canvas.style.height = WORLD_H * k + 'px';

  const line = 'rgba(255,255,255,' + 10 / 255 + ')';
  const cell = CELL * k;
  const originX = (innerWidth - WORLD_W * k) / 2;     // where the level's (0,0) lands on the page
  const originY = (innerHeight - WORLD_H * k) / 2;
  document.body.style.backgroundImage =
    'linear-gradient(to right, ' + line + ' ' + k + 'px, transparent ' + k + 'px), ' +
    'linear-gradient(to bottom, ' + line + ' ' + k + 'px, transparent ' + k + 'px)';
  document.body.style.backgroundSize = cell + 'px ' + cell + 'px';
  document.body.style.backgroundPosition = originX + 'px ' + originY + 'px';
}
addEventListener('resize', fitCanvas);
fitCanvas();
canvas.focus();

// J toggles fullscreen (F11 is the browser's own). The canvas keeps its
// whole-number scale and stays centred on the extended grid.
function toggleFullscreen() {
  if (document.fullscreenElement) document.exitFullscreen();
  else document.documentElement.requestFullscreen().catch(() => {});
}

// ---- Game loop ----
let time = 0;                          // seconds of game time, drives animations
let lastFrame = performance.now();
let accumulator = 0;

// Drains the latched presses into this update's flags, one frame each.
function drainInput() {
  for (const k in pending) { pressed[k] = pending[k]; pending[k] = false; }
}

// One fixed 1/60 s step of game logic. Later roadmap steps hang off here.
function update() {
  time += STEP;
  drainInput();
  clicked = pressed.click;

  if (screen === SCREEN_LEVEL1) {
    handleDeathInput();                // may send us back to the picker
    if (screen === SCREEN_LEVEL1) {
      readInput();
      harryHandleSelect();             // the pointer picks which character the keys drive
      if (!dead) clickButtons();
      updateGame();
      updateHarry();
      updateHarryBullets();
    }
  }
  if (screen === SCREEN_LEVEL3) {
    readInput();
    harryHandleSelect();
    updateHarry();
    updateHarryBullets();
    updateLevel3Movers();
  }
  if (screen === SCREEN_LEVEL4) {
    readInput();
    harryHandleSelect();
    updateHarry();
    updateHarryBullets();
    updateLevel4();
  }
  updateLevel2();                      // gates itself to level 2
  updateScreenButtons();               // whatever clicks are left belong to the picker or the Back button
}

// Draws one frame of whichever screen is up.
function draw() {
  if (screen === SCREEN_SELECT) {
    ctx.drawImage(gridLayer, 0, 0);
    drawSelectScreen();
  } else if (screen === SCREEN_LEVEL1) {
    drawLevel1();
  } else if (screen === SCREEN_LEVEL2) {
    drawLevel2Screen();
  } else if (screen === SCREEN_LEVEL3) {
    drawLevel3Screen();
  } else {
    drawLevel4Screen();
  }
  drawToast();
  drawCellNumber();
  drawFps();
}

// ---- FPS readout (F) ----
let fpsFrames = 0;
let fpsSince = 0;
let fpsText = '';

function resetFpsWindow() {
  fpsFrames = 0;
  fpsSince = 0;
  fpsText = 'measuring...';
}

// Counts rendered frames over half-second windows, like Game.tickFps.
function tickFps(now) {
  fpsFrames++;
  if (fpsSince === 0) fpsSince = now;
  const elapsed = now - fpsSince;
  if (elapsed < 500) return;
  if (debug.fps) {
    fpsText = Math.round(fpsFrames * 1000 / elapsed) + ' fps - ' + (elapsed / fpsFrames).toFixed(1) + ' ms';
  }
  fpsFrames = 0;
  fpsSince = now;
}

// Top-right readout, in the HUD's green.
function drawFps() {
  if (!debug.fps) return;
  ctx.font = 'bold 13px -apple-system, "Helvetica Neue", Arial, sans-serif';
  ctx.textAlign = 'right';
  ctx.textBaseline = 'top';
  ctx.fillStyle = '#7dffa8';
  ctx.fillText(fpsText, WORLD_W - 16, 46);
}

// requestAnimationFrame callback: run as many fixed steps as real time owes
// (so 60/120/144 Hz screens play identically), then render once.
function frame(now) {
  accumulator += Math.min((now - lastFrame) / 1000, MAX_CATCH_UP);
  lastFrame = now;
  while (accumulator >= STEP) {
    update();
    accumulator -= STEP;
  }
  draw();
  tickFps(now);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
