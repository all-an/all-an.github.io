<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Java Courses</title>
  <link rel="stylesheet" href="java.css" />
</head>
<body>
<div class="wrap">

  <!-- header: title + subtitle, with a link back to the skillset page -->
  <div class="header">
    <div class="header-titles">
      <h1>Java Courses</h1>
      <span class="subtitle">Courses taken on traditional, JVM-based Java.</span>
    </div>
    <div class="header-links">
      <a class="back" href="bookmarks/">🔖 Bookmarks</a>
      <a class="back" href="../../skillset.html">← skillset</a>
    </div>
  </div>

  <!-- search box + category/status filters + result count -->
  <div class="controls">
    <input type="text" id="search" placeholder="Search courses, categories, status..." />
    <select id="catFilter">
      <option value="">All categories</option>
      <option value="concepts">Concepts</option>
      <option value="oop">OOP</option>
      <option value="collections">Collections</option>
      <option value="io">I/O</option>
      <option value="concurrency">Concurrency</option>
    </select>
    <select id="statusFilter">
      <option value="">All statuses</option>
      <option value="completed">Completed</option>
      <option value="inprogress">In progress</option>
      <option value="planned">Planned</option>
    </select>
    <span class="count" id="count"></span>
  </div>

  <!-- the list of courses, filled in by java.js -->
  <div class="tbl-wrap">
    <table>
      <thead>
        <tr>
          <th>#</th>
          <th>Course</th>
          <th>Category</th>
          <th>Status</th>
        </tr>
      </thead>
      <tbody id="tbody"></tbody>
    </table>
  </div>
  <div class="no-results" id="noResults" style="display:none;">No courses match.</div>

</div>

<script src="java-data.js"></script>
<script src="java.js"></script>
</body>
</html>
