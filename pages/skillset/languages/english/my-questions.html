<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My Questions — Allan Pereira Abrahão</title>
<style>
:root {
  --color-background-primary:   #111113;
  --color-background-secondary: #1a1a1e;
  --color-text-primary:         #e8e8ea;
  --color-text-secondary:       #9898a0;
  --color-text-tertiary:        #5e5e66;
  --color-border-secondary:     #2e2e33;
  --color-border-tertiary:      #232328;
  --color-correct:              #9FE1CB;
  --color-wrong:                #F7C1C1;
  --border-radius-md:           7px;
  --font-mono:                  'JetBrains Mono', 'Fira Code', 'Courier New', monospace;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: var(--color-background-primary); color: var(--color-text-primary); font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
.wrap { max-width: 640px; margin: 0 auto; padding: 2.5rem 2rem 4rem; }

/* nav */
.nav { display: flex; justify-content: space-between; align-items: center; margin-bottom: 2.5rem; }
.nav a { font-size: 18px; color: var(--color-text-secondary); text-decoration: none; }
.nav a:hover { color: var(--color-text-primary); }

/* header */
h1 { font-size: 34px; font-weight: 700; letter-spacing: -0.02em; margin-bottom: 0.4rem; }
.tagline { font-size: 20px; color: var(--color-text-secondary); margin-bottom: 2rem; line-height: 1.5; }

/* buttons */
.btn { font-size: 17px; color: var(--color-text-primary); background: var(--color-background-secondary); border: 1px solid var(--color-border-secondary); border-radius: var(--border-radius-md); padding: 10px 18px; cursor: pointer; font-family: inherit; }
.btn:hover:not(:disabled) { border-color: #3a3a44; background: #202027; }
.btn:disabled { color: var(--color-text-tertiary); cursor: default; }
.btn-primary { background: #26215C; border-color: #3a3480; color: #CECBF6; }
.btn-primary:hover { background: #302a72; }
a.btn { display: inline-block; text-decoration: none; }

/* question list */
.list { display: flex; flex-direction: column; gap: 10px; }
.row { display: flex; align-items: flex-start; gap: 14px; background: var(--color-background-secondary); border: 1px solid var(--color-border-tertiary); border-radius: var(--border-radius-md); padding: 14px 16px; }
.row-body { flex: 1; min-width: 0; }
.row-index { font-family: var(--font-mono); font-size: 14px; color: var(--color-text-tertiary); padding-top: 3px; }
.row-text { font-size: 19px; line-height: 1.45; word-wrap: break-word; }
.row-text .blank { font-family: var(--font-mono); color: #CECBF6; }
.row-meta { font-size: 15px; color: var(--color-text-secondary); margin-top: 0.5rem; line-height: 1.5; }
.row-answer { color: var(--color-correct); }
.row-type { font-size: 13px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--color-text-tertiary); }
.row-del { font-size: 20px; line-height: 1; color: var(--color-text-tertiary); background: none; border: none; cursor: pointer; padding: 4px 6px; font-family: inherit; }
.row-del:hover { color: var(--color-wrong); }

/* empty state */
.empty { font-size: 18px; color: var(--color-text-secondary); line-height: 1.6; background: var(--color-background-secondary); border: 1px solid var(--color-border-tertiary); border-radius: var(--border-radius-md); padding: 1.75rem; }

/* pagination */
.pager { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-top: 1.5rem; }
.pager-status { font-size: 16px; color: var(--color-text-secondary); text-align: center; }
.count { font-size: 15px; color: var(--color-text-tertiary); margin-bottom: 1rem; }

/* footer actions */
.actions { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 2rem; }

.hidden { display: none; }

/* narrow screens: stack the rows and let the controls fill the width */
@media (max-width: 520px) {
  .wrap { padding: 2rem 1.1rem 3rem; }
  h1 { font-size: 28px; }
  .tagline { font-size: 18px; }
  .row { padding: 12px 13px; gap: 10px; }
  .row-text { font-size: 17px; }
  .row-meta { font-size: 14px; }
  .pager { flex-wrap: wrap; }
  .pager .btn { flex: 1; padding: 10px 12px; }
  .pager-status { flex-basis: 100%; order: -1; }
  .actions .btn { flex: 1; text-align: center; }
}
</style>
</head>
<body>
<div class="wrap">

  <nav class="nav">
    <a href="english.html">← back</a>
  </nav>

  <h1>My Questions</h1>
  <p class="tagline">Everything saved in this browser, newest last.</p>

  <div class="count" id="count"></div>
  <div class="list" id="list"></div>

  <!-- page controls, hidden while everything fits on one page -->
  <div class="pager hidden" id="pager">
    <button class="btn" id="prevBtn" onclick="goToPage(page - 1)">← Prev</button>
    <div class="pager-status" id="pagerStatus"></div>
    <button class="btn" id="nextBtn" onclick="goToPage(page + 1)">Next →</button>
  </div>

  <div class="actions">
    <a class="btn btn-primary" href="english.html">Add a question</a>
  </div>

</div>

<script>
// Same bank the drill page writes to: this browser's localStorage.
// Stored shape, one object per question:
//   {text, type:"choice", opts:[correct, ...wrong]}   opts[0] is always the answer
//   {text, type:"typed",  answers:[...]}              any accepted spelling
const STORAGE_KEY = "english.myQuestions";

const PAGE_SIZE = 8;   // questions shown per page

let questions = loadQuestions();
let page = 1;          // 1-based index of the page on screen

// Cached elements
const el = (id) => document.getElementById(id);

// Make user-written text safe to drop into innerHTML.
function escapeHtml(text) {
  return text.replace(/[&<>"']/g, (c) =>
    ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}

// Read the saved bank, treating missing or unreadable storage as empty.
function loadQuestions() {
  try {
    const stored = JSON.parse(localStorage.getItem(STORAGE_KEY));
    return Array.isArray(stored) ? stored : [];
  } catch {
    return [];
  }
}

// Persist the bank. Storage can be blocked (private mode), so failure is ignored.
function saveQuestions() {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(questions));
  } catch {
    // The list on screen still reflects the change; only persistence is lost.
  }
}

// How many pages the current bank needs, never fewer than one.
function pageCount() {
  return Math.max(1, Math.ceil(questions.length / PAGE_SIZE));
}

// Show a different page, clamped to the pages that exist.
function goToPage(target) {
  page = Math.min(Math.max(target, 1), pageCount());
  render();
  window.scrollTo({ top: 0, behavior: "smooth" });
}

// Drop one question, then stay on a page that still has rows.
function deleteQuestion(index) {
  questions.splice(index, 1);
  saveQuestions();
  if (page > pageCount()) page = pageCount();
  render();
}

// The answer line under each question: the solution, and the decoys for a
// multiple-choice question so the whole item can be checked at a glance.
function answerLine(question) {
  if (question.type === "typed") {
    return '<span class="row-answer">' + escapeHtml(question.answers.join(", ")) + "</span>";
  }
  const [correct, ...wrong] = question.opts;
  return '<span class="row-answer">' + escapeHtml(correct) + "</span>" +
         (wrong.length ? " · " + escapeHtml(wrong.join(" · ")) : "");
}

// Draw the current page, the counter and the pager.
function render() {
  el("count").textContent = questions.length === 1
    ? "1 question saved"
    : questions.length + " questions saved";

  if (!questions.length) {
    el("list").innerHTML =
      '<div class="empty">No questions yet. Write your first one on the ' +
      '<a href="english.html" style="color:#CECBF6">question page</a>.</div>';
    el("pager").classList.add("hidden");
    return;
  }

  const start = (page - 1) * PAGE_SIZE;
  const shown = questions.slice(start, start + PAGE_SIZE);

  el("list").innerHTML = shown.map((q, i) => {
    const index = start + i;   // position in the full bank, for numbering and delete
    return '<div class="row">' +
        '<span class="row-index">' + (index + 1) + '</span>' +
        '<div class="row-body">' +
          '<div class="row-text">' +
            escapeHtml(q.text).replace("___", '<span class="blank">_____</span>') +
          "</div>" +
          '<div class="row-meta">' +
            '<span class="row-type">' + (q.type === "typed" ? "typed" : "choice") + "</span> · " +
            answerLine(q) +
          "</div>" +
        "</div>" +
        '<button class="row-del" title="Delete" onclick="deleteQuestion(' + index + ')">×</button>' +
      "</div>";
  }).join("");

  const pages = pageCount();
  el("pager").classList.toggle("hidden", pages === 1);
  el("pagerStatus").textContent = "Page " + page + " of " + pages;
  el("prevBtn").disabled = page === 1;
  el("nextBtn").disabled = page === pages;
}

render();
</script>
</body>
</html>
