<div class="wrap">
  <a class="back" href="../clean-code.html">← back</a>
  <h1>G29: Avoid Negative Conditionals</h1>
  <p class="desc">A positive condition reads faster than its negation — flip !isNotX to isX.</p>

  <div class="example-label avoid">Avoid — a double negative</div>
  <pre><code class="language-java">if (!isNotEligible(user)) { /* ... */ }</code></pre>

  <div class="example-label prefer">Prefer — stated positively</div>
  <pre><code class="language-java">if (isEligible(user)) { /* ... */ }</code></pre>
</div>
