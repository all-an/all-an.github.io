<body>
<div class="wrap">
  <a class="back" href="../clean-code.html">← back</a>
  <h1>N1: Choose Descriptive Names</h1>
  <p class="desc">A name should say why something exists and what it does — not just save keystrokes.</p>

  <div class="example-label avoid">Avoid — d could mean anything</div>
  <pre><code class="language-java">int d; // elapsed time in days</code></pre>

  <div class="example-label prefer">Prefer — the name carries the meaning, no comment needed</div>
  <pre><code class="language-java">int elapsedTimeInDays;</code></pre>
</div>
